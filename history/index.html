<!-- /history/ 歷史之路（2026-11-06，批 2）

     Paul 2026-11-05 看了 asklex.law/journey 之後定的：一頁「BT 怎麼走過來」，捲動就沿著一條路往前走，
     每一站可以點開看那一年的說明與照片。計畫在 docs/2026-11-05-BT-歷史之路計畫.md。

     ── 這一頁在做什麼 ──
     一趟機場（批 4 Paul 定的主題：BT 的名字、Passport 的入境章、學生出國，都是機場），批 5（2026-11-06）換成真的 3D（Three.js）。
     捲動的比例切成四段：0 到 30% 鏡頭在航廈裡面跟著一個背背包的旅客走（地磚、玻璃牆外的飛機、報到櫃台、出發看板、安檢、座位、商店、登機門）；
     30 到 40% 走進空橋、穿過機艙門、鏡頭升高後退到停機坪的視角，一條連續的鏡頭曲線不切鏡；40 到 80% 一架 BT 顏色的飛機從登機門推出去、
     沿一條三個彎的滑行道經過航廈、塔台、機棚、消防站、別的飛機；80 到 100% 對正跑道、加速、抬頭、收輪、爬升，鏡頭繞到後面追，機場在霧裡縮小。
     站不管幾個都平均分在整趟上，每一站照自己落在哪一段有一個 3D 的錨點（走道旁、滑行道旁、空中），一個小場景加一張卡（卡是 HTML，用相機投影貼上去）；點卡打開覆蓋層。
     底部一條年份帶，左上一個淡淡的大年份。出發看板掛在航廈裡，列的是真的站（年份當時間、英文標題當目的地），字是程式畫的 canvas 貼圖。
     開了「減少動態效果」、網址加 ?motion=off、沒有 WebGL、Three 或 GSAP 從 cdnjs 載不到：同樣的站排成直立時間軸，一站都不少。

     ── 資料只從一個地方來 ──
     public_milestones()，資料庫那支只回放上去的站與勾了同意的照片。這一頁一行站的文字都沒寫死。
     要加一站：後台 → 對外 → 歷史之路（README「歷史之路」）。**這一頁一行都不用動。**

     ── 檔案 ──
     history.css 版面、src/strings.js 中英字典、src/data.js 資料與代號、src/ui.js 畫面的純函式、
     src/airport.js 機場的數字（飛機、鏡頭、旅客、站的錨點，純數學）、src/plane.js 客機工廠、
     src/scene.js Three 的場景與唯一會動的 motion()、src/main.js 接起來。只讀 shared/brand.css 與 shared/supabase-config.js。
     Three 從 cdnjs 載（下面的 importmap，帶 integrity），沒有模型檔、沒有貼圖檔，全部用程式幾何。

     ── 不掛 nav.js ──
     這一頁是給外面的人看的一條路，不是功能清單。左上一個回首頁的 logo 就夠。 -->

<meta name="description" content="Beyond Taiwan 怎麼走過來：從七個人到七個國家，一站一站。">

<!-- Three.js 只從 cdnjs 載。integrity 是 cdnjs 公布的 sha512（2026-11-06 用 curl 加 openssl 算過一致），檔案被換掉瀏覽器就不執行，
     那時 scene.js 載不進來，這一頁退回直立時間軸不會壞。升級版本要同時改這裡的網址與雜湊、check.sh 的 THREE_SRI。
     importmap 一定要排在任何 module script 前面。 -->
<script type="importmap">
{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js"},
 "integrity":{"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js":"sha512-zTnt1Hf43YVf2to5DC6GE6cPRSC/xgPJDf3PLQussTsaDak1uHdbnWtIYnOQiL40AIa2OZfFkayQXVdzL1/DqA=="}}
</script>

<!-- GSAP 在頁尾載，這裡先預告，瀏覽器提早去抓。preload 的屬性要跟頁尾那支一字不差（check.sh 的理由見首頁）。兩支都預告。 -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preload" as="script" crossorigin="anonymous" referrerpolicy="no-referrer"
      integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
      href="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
<link rel="preload" as="script" crossorigin="anonymous" referrerpolicy="no-referrer"
      integrity="sha512-onMTRKJBKz8M1TnqqDuGBlowlH0ohFzMXYRNebz+yOcc5TQr/zAKsthzhuv0hiyUKEiQEQXEynnXCvNTOk50dg=="
      href="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js">
<!-- main.js 底下那四支模組先預告，不用等 main.js 讀完才一支一支去抓（Lighthouse 實測模組是三層瀑布）。
     Supabase 的 preconnect 刻意不加：那要把專案網址再抄一份在這裡，check.sh 不准（網址只能在 shared/supabase-config.js）。 -->
<link rel="modulepreload" href="./src/data.js">
<link rel="modulepreload" href="./src/ui.js">
<link rel="modulepreload" href="./src/scene.js">
<link rel="modulepreload" href="./src/strings.js">
<link rel="modulepreload" href="../shared/supabase-config.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字體不擋渲染（跟首頁同一招：media=print，載完切回 all）。中文標題載 Noto Sans TC 900 一個字重。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@900&display=swap"></noscript>
<link rel="stylesheet" href="../shared/brand.css">
<link rel="stylesheet" href="./history.css">

<!-- 語言要在第一次繪製前決定，不然中英兩份會先疊著出現一下。
     順序：網址 ?lang=（上一頁選的）、再 localStorage 的 bt-lang（登入後那些頁用的同一把鍵，只讀不寫）、再瀏覽器語言。 -->
<script>
  (function () {
    var q = null, s = null;
    try { q = new URLSearchParams(location.search).get("lang"); } catch (e) {}
    try { s = localStorage.getItem("bt-lang"); } catch (e) {}
    var l = (q === "zh" || q === "en") ? q : (s === "zh" || s === "en") ? s : (/^zh/i.test(navigator.language || "") ? "zh" : "en");
    document.documentElement.setAttribute("data-lang", l);
    document.documentElement.lang = l === "zh" ? "zh-Hant" : "en";
  })();
</script>
</head>
<body>

<header class="top">
  <a class="home" id="home" href="../" aria-label="Beyond Taiwan 首頁 / home">
    <img src="../shared/logo.png" alt="Beyond Taiwan" width="386" height="191">
  </a>
  <div class="title">
    <h1><span class="zh">歷史之路</span><span class="en">Our Road</span></h1>
    <p class="sub"><span class="zh">BT 怎麼走過來。往下捲，沿著路走。</span><span class="en">How BT got here. Scroll to walk the road.</span></p>
  </div>

    <button type="button" class="lang" id="lang" aria-label="Switch language">EN</button>
  </div>
</header>

<main id="main">
  <div id="state" class="state-wrap"></div>

  <!-- 會動的那一條：外面這一段很高（JS 照站數設），裡面的 stage 被釘住一整屏，捲動只推鏡頭。
       .world 包住 3D 的 canvas 與卡，靠近一站時整個一起稍微放大。骨架卡在資料來之前先站著。 -->
  <section class="road-wrap" id="road-wrap" hidden>
    <div class="stage" id="stage">
      <div class="world" id="world">
        <canvas id="scene" class="scene" aria-hidden="true"></canvas>
        <div class="cards" id="cards"></div>
      </div>
      <!-- 左上淡淡的大年份：顯示字型的真文字。Paul 2026-11-06 看過方塊數字覺得突兀，改成文字，Lighthouse 模擬的 LCP 數字他接受。年份由 main.js 塞進來。 -->
      <div class="ghost" id="ghost" aria-hidden="true"></div>
      <div class="skeleton-wrap" id="skeleton"></div>
      <!-- 最後一站之後那一句安靜的結尾（中英在 strings.js）。 -->
      <div class="end" id="end" aria-hidden="true"></div>
      <p class="hint" id="hint" aria-hidden="true"><span class="zh">往下捲</span><span class="en">Scroll</span><span class="hint-arrow"></span></p>
    </div>
  </section>

  <!-- 減少動態效果、?motion=off、沒有 WebGL、Three 或 gsap 沒載到：直立時間軸，同樣的站一站不少。 -->
  <section class="static" id="static" hidden>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <noscript><p class="state"><span class="zh">這一頁要開 JavaScript 才看得到路。每一站的文字也在首頁「五年走過來」那一段。</span><span class="en">This page needs JavaScript to draw the road. The same stops are written out on the home page under “Five years so far”.</span></p></noscript>
</main>

<nav class="strip" id="strip" aria-label="每一站 / Every stop" hidden></nav>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden></div>
<div class="lightbox" id="lightbox" hidden></div>

<!-- 主程式排在 GSAP 前面、GSAP 加 defer：三支都在網頁讀完之後照順序跑，所以主程式先跑、先去拿資料、先把骨架畫出來，
     不用等 GSAP 下載完。主程式會等那兩支載完（或失敗）、再動態 import scene.js（它才去 cdnjs 拿 Three），
     兩個都到了才走 3D，不然直立時間軸（main.js 的 boot 與 airport.js 的 pickMode）。
     GSAP 從 cdnjs 載，integrity 是 cdnjs 公布的雜湊，檔案被換掉就不執行；那時這一頁退回直立時間軸，不會壞。
     升級版本要同時改這裡、head 的兩個 preload、首頁、check.sh 的兩個雜湊。 -->
<script type="module" src="./src/main.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer
        integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer
        integrity="sha512-onMTRKJBKz8M1TnqqDuGBlowlH0ohFzMXYRNebz+yOcc5TQr/zAKsthzhuv0hiyUKEiQEQXEynnXCvNTOk50dg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
