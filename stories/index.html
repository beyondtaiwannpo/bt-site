<!-- /stories/ 嘖嘖募資的互動頁（2026-11-16，demo）

     Paul 2026-10-13 定的：募資的互動內容放官網自己一頁，主線是 three personas，陌生人挑一個公立高中生、走一遍他申請的那一年，
     最後落到「贊助這個計畫」。2026-11-16 訪談後定了八關、三個學生（一個留台灣、一個社區大學、一個獎學金）、單線、中文優先。
     計畫在 ~/Anson/outputs/beyond-taiwan/zeczec/web/2026-11-16-persona-page-plan/。

     ── 這一頁在做什麼 ──
     第一屏三張學生卡。選一個就開始：每一關一個情境、兩個選擇，沒有對錯；選完出現一句真實學員的話、這一關 BT 做了什麼、
     這時候在你旁邊的人。探索營那一關是便利貼牆，找 mentor 那一關是地圖，放榜之後翻開一封給一年後自己的信。
     結尾一屏：這一年對學員是 0 元，一顆按鈕回嘖嘖。從嘖嘖來的人（?from=zeczec）只有這條路；別的人多一顆回首頁。
     上面那一塊是「舞台」，有兩個殼可以比：?shell=lamp 是首頁那座島一盞一盞亮起來；?shell=flight 是 /history/ 那座 3D 機場的登機門。
     開了減少動態效果、?motion=off、殼載不到：舞台是一張靜的島，內容一字不少。

     ── 資料 ──
     劇本 script.json、人物 people.json，兩份都在這個資料夾，現在是範例（demo: true）。換真的劇本不用動程式。
     沒有 consent_date 的人不會出現。未成年不放名字不放臉。

     ── 檔案 ──
     stories.css 版面、src/strings.js 中英字典、src/data.js 讀資料與網址、src/ui.js 畫面的純函式、src/layout.js 兩個殼的數字（純數學）、
     src/island.js 島的座標（跟首頁同一份）、src/shell-lamp.js 點燈版、src/shell-flight.js 機場版（Three）、src/plane.js 與 src/person.js 從 /history/ 抄來、
     src/engine.js 接起來。只讀 shared/brand.css。GSAP 與 Three 只從 cdnjs 載、帶 integrity。

     ── 不掛 nav.js ──
     這一頁只有兩條路：繼續看，或回嘖嘖。不連 apply、join、team。左上一個回首頁的 logo 就夠。 -->

</script>

<!-- 語言要在第一次繪製前決定。順序：網址 ?lang=、再 localStorage 的 bt-lang（只讀不寫）、再瀏覽器語言。這一頁預設中文。 -->
<script>
  (function () {
    var q = null, s = null;
    try { q = new URLSearchParams(location.search).get("lang"); } catch (e) {}
    try { s = localStorage.getItem("bt-lang"); } catch (e) {}
    var l = (q === "zh" || q === "en") ? q : (s === "zh" || s === "en") ? s : (/^en/i.test(navigator.language || "") ? "en" : "zh");
    document.documentElement.setAttribute("data-lang", l);
    document.documentElement.lang = l === "zh" ? "zh-Hant" : "en";
  })();
</script>
