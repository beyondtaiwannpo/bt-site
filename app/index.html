<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond Taiwan</title>
<!-- 這一頁不要進搜尋結果。它是登入頁，路人從搜尋結果直接掉進來只會看到一個
     他登不進去的表單，而對外的入口是首頁。noindex 也順便讓 Lighthouse 的
     SEO 從 91 回到 100 —— 那 9 分扣的就是「這頁沒有描述」，
     但登入頁本來就不該有對外描述。
     ⚠ 只有這一頁。/passport/ 與 /availability/ 沒有這一行也進不了索引，
     因為它們沒登入會被導走；對外那七頁一行都不要加。 -->
<meta name="robots" content="noindex, nofollow">
<!-- 2026-09-02（階段 7 前置）：這一頁是登入後的入口（規格 §2-1）。
     `/` 是對外簡介，`/app/` 是登入與登入後的選單，`/passport/` 只剩護照本身。

     ── 圖示與 manifest（2026-09-02 從 passport/ 搬到 shared/）──
     **manifest 的 start_url 指這一頁。** 幹部釘到主畫面的是「登入後看得到
     全部功能的那一頁」，不是護照 —— 護照現在只是選單裡的一個入口，
     時間看板也在那個選單裡。scope 是 "/"，所以四個資料夾都在範圍內。

     背景色用 #EDE5D8 不是隨便挑的 —— logo 本來就是坐在卡片的那個紙色上設計的
     （它同時有深色與淺色筆畫，換成別的底色其中一半會消失）。
     圖示四周留了 14% 的邊：iOS 會把主畫面圖示切圓角，貼邊的話 logo 會被切掉。
     apple-touch-icon 是 iOS 用的，manifest 裡的 192/512 是 Android 用的，兩邊都要。
     **所有尺寸都只用左邊的台灣圖形，不含 Beyond Taiwan 字樣。**
     兩個理由：整組橫式 logo 縮到 32px 會糊成一團認不出來；而主畫面圖示實際顯示
     大約 60pt，那個大小下「Beyond Taiwan」那行字也已經看不清了。
     圖形與文字的切點（原圖 x=160）是量出來的，不是目測：逐欄統計不透明像素，
     那裡有一段 35px 全透明的空白。
     一開始大尺寸留了整組 logo、小尺寸用圖形，後來統一成圖形 ——
     同一個 app 在不同位置長得不一樣，比哪一種好看更糟。 -->
<link rel="icon" type="image/png" sizes="32x32" href="../shared/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../shared/favicon-48.png">
<link rel="apple-touch-icon" href="../shared/apple-touch-icon.png">
<link rel="manifest" href="../shared/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Beyond Taiwan">
<meta name="theme-color" content="#EDE5D8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/brand.css">

<style>
  /* 色票、字體家族、圓角全部來自 ../shared/brand.css，這裡一個都不重新宣告。

     2026-09-07 翻新：這一頁是**外人按下「登入」之後看到的第一頁**，
     所以視覺要跟對外那幾頁是同一個系統 —— 紙底、右上角的暖光、浮起來的玻璃、
     藥丸形的按鈕。原本它長得像一個獨立的後台。

     下面這些卡片與按鈕的樣式跟 passport/index.html 裡的長得很像，
     **是各寫一份，不是共用的** —— brand.css 的檔頭明文寫著不要把按鈕、卡片、
     格線搬進去，理由是那會變成一個沒有人敢動的全站樣式表。

     ── 這一頁不載中文網頁字體 ──
     對外的內容頁有載（中文標題要撐到 96px 以上），這一頁的中文只有短標籤，
     系統字體就夠。它是登入的必經之路，少三萬多位元組的 CSS 比較實在。
     check.sh 的 FONT_CJK_PAGES 沒有把這一頁加進去，是刻意的。

     ── 透明度不要拿來調文字顏色 ──
     舊版用 opacity .55 到 .7 讓次要文字變淡。那會連對比度一起打折，
     深藍在米白上 .7 只有約 4.2:1，過不了 WCAG AA 的 4.5:1。
     現在一律用 rgba 指定顏色並且算過對比（.78 以上）。
     這是這個 repo 第四次踩同一件事，README 有記。 */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{overflow-x:clip}
  body{margin:0;background:var(--paper);overflow-x:clip}
  /* 右上角的一道暖光，跟對外那幾頁同一個做法。 */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(118% 88% at 80% 4%, var(--bt-sand) 0%, rgba(255,232,197,0) 60%)}

  /* 回首頁的路。外人從對外頁按「登入」進來，得有辦法回去。 */
  .apphead{position:relative;z-index:1;padding:clamp(18px,4vw,32px) clamp(16px,5vw,32px) 0;
    max-width:560px;margin:0 auto}
  .apphead a{display:inline-block;position:relative}
  .apphead img{height:28px;width:auto;display:block}
  .apphead a::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 22px);height:44px}

  #bt-root{
    position:relative;z-index:1;
    font-family:var(--body);color:var(--ink);line-height:1.55;
    max-width:520px;margin:0 auto;padding:clamp(16px,4vw,32px) 16px 48px;
  }
  /* :where() 是必要的，不是風格。裸寫 #bt-root button 的特異性會蓋掉所有
     用 class 描述外觀的規則，.btn 的深藍底、.btn.ghost 的外框全部會失效。
     護照那邊因為這件事，畫面上所有按鈕的外觀死了一個多月都沒有人發現。
     **不要把 :where() 拿掉**（見 passport/index.html 同一條的註解）。 */
  :where(#bt-root button){font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
  #bt-root :focus-visible{outline:2px solid var(--bt-navy);outline-offset:3px}

  /* 卡片：跟頂欄同一塊玻璃。四層見 README「頂欄的 liquid glass」。
     內距與標題在手機上要縮小 —— 之前 30/28 加 36px 的 h2 在 390px 的螢幕上，
     卡片有三分之一是留白與標題，表單本身被擠到第二屏（2026-09-03，7-4）。 */
  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(237,229,216,.5));
    backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);border-radius:20px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.75),
               0 12px 34px rgba(16,42,134,.10),0 2px 6px rgba(16,42,134,.05);
    padding:clamp(24px,5vw,34px) clamp(20px,5vw,30px);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .card{background:rgba(255,255,255,.8)}
  }
  .card h2{font-family:var(--display);font-size:clamp(30px,7.4vw,42px);font-weight:700;
    letter-spacing:.01em;margin:0 0 6px;line-height:1.02}
  .card .sub{font-size:14.5px;color:rgba(16,42,134,.8);margin-bottom:22px}

  label{display:block;margin-bottom:16px}
  label i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:rgba(16,42,134,.8);display:block;margin-bottom:6px}
  input{
    width:100%;font-family:var(--body);font-size:15.5px;color:var(--ink);
    padding:12px 14px;border:1px solid rgba(16,42,134,.28);border-radius:12px;
    background:rgba(255,255,255,.7);
  }
  input:focus-visible{outline:2px solid var(--bt-navy);outline-offset:2px;border-color:transparent}

  /* 下拉。跟 input 同一個外觀，但 appearance:none 之後要自己畫箭頭，
     所以刻意不畫 —— 保留瀏覽器原生的箭頭，各家長得不一樣但都看得懂，
     而且鍵盤與螢幕閱讀器的行為是免費拿到的。 */
  select{
    width:100%;font-family:var(--body);font-size:15.5px;color:var(--ink);
    padding:12px 14px;border:1px solid rgba(16,42,134,.28);border-radius:12px;
    background:rgba(255,255,255,.7);
  }
  select:focus-visible{outline:2px solid var(--bt-navy);outline-offset:2px;border-color:transparent}

  /* 勾選框。
     ⚠ 上面那條 input{width:100%} 會把打勾的方框拉成滿版的一條，
     所以這裡一定要把寬度收回來。改上面那條規則之前先想到這一格。
     整段文字包在 <label> 裡，點字也能打勾 —— 手機上那個方框只有十幾像素，
     不讓人點字的話很多人點不到。 */
  .check{display:flex;gap:11px;align-items:flex-start;margin-bottom:16px;
    font-size:14px;line-height:1.6;cursor:pointer}
  .check input[type="checkbox"]{width:18px;height:18px;flex:none;margin:3px 0 0;
    accent-color:var(--bt-navy);cursor:pointer}
  .check span{color:rgba(16,42,134,.88)}
  /* 可點區域至少 44 高，視覺不變。跟頂欄那幾顆同一個做法。 */
  .check{position:relative;padding:4px 0}

  /* 「我的資料」那幾行。左標籤右內容，中間一條細線，
     跟對外頁的 .rows 同一套語言（不是六張圓角卡片）。 */
  .kv{margin:0 0 4px;padding:0;list-style:none}
  .kv li{display:grid;grid-template-columns:6.5em 1fr;gap:14px;
    padding:11px 0;border-top:1px solid rgba(16,42,134,.13);font-size:14.5px}
  .kv li:first-child{border-top:0}
  .kv b{font-weight:600;color:rgba(16,42,134,.72);font-size:13px;letter-spacing:.03em}
  .kv span{color:var(--ink);overflow-wrap:anywhere}
  .kv .empty-v{color:rgba(16,42,134,.55)}

  /* 學員頁的小標題與「我的申請／現在開放」那兩區（批 3）。 */
  .sec-h{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.03em;
    margin:26px 0 6px;color:rgba(16,42,134,.9)}
  .sec-h:first-of-type{margin-top:4px}
  .applist{margin:0 0 4px;padding:0;list-style:none}
  .applist li{padding:13px 0;border-top:1px solid rgba(16,42,134,.13)}
  .applist li:first-child{border-top:0}
  .applist b{display:block;font-size:15.5px;font-weight:600;line-height:1.35}
  /* 狀態一律是文字，不是只有顏色。用顏色當唯一訊息的話，
     色覺不同的人看到的是四個一樣的灰點。 */
  .st{display:inline-block;margin-top:5px;font-size:13px;padding:3px 10px;border-radius:999px;
    background:rgba(16,42,134,.09);color:rgba(16,42,134,.92)}
  .st-accepted{background:rgba(107,198,187,.45)}
  .st-interview{background:rgba(255,196,108,.45)}
  .st-rejected{background:rgba(198,198,198,.45)}
  .st-more{margin-top:7px;font-size:13.5px}
  .st-more a{color:var(--ink);font-weight:600}
  .st-more .empty-v{color:rgba(16,42,134,.62);margin-left:8px}

  /* ── 按鈕的輕重（2026-09-03，7-4）──
     一頁只有**一顆**實心深藍鈕，就是主要動作，滿版。
     第二選擇（Google）是滿版的框線鈕，用內文字體、不大寫、一行 ——
     之前它用 display 字體大寫加雙語標籤，折成兩行、成了整頁最大的元素，
     比主要動作還搶眼（使用者 2026-09-01 的回報；量到是 284×71 對 84×47）。
     導覽（切換登入／註冊、回登入、登出）不是按鈕，是文字連結：見 .link。
     這裡不再有 .quiet：護照那邊的 .btn.quiet 是給「清除這本護照」的安全降級，
     跟「這顆不是主要動作」不是同一件事，同名只會讓人把兩者混在一起。
     2026-09-07：形狀改成藥丸，跟對外那幾頁的 CTA 一致。輕重的規則沒有變。 */
  .btn{
    display:block;width:100%;
    font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:14px 20px;border-radius:999px;background:var(--bt-navy);color:var(--bt-cream);
    transition:background .15s;text-align:center;
  }
  .btn:hover{background:var(--bt-orange);color:var(--bt-navy)}
  .btn[disabled]{opacity:.4;cursor:default}
  .btn.ghost{
    background:none;color:var(--ink);border:1px solid rgba(16,42,134,.35);
    font-family:var(--body);font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;
    padding:13px 16px;
  }
  .btn.ghost:hover{background:rgba(255,255,255,.7);color:var(--ink)}
  .btn.sm{display:inline-block;width:auto;font-size:14px;padding:8px 16px}
  .link{background:none;border:none;padding:0;font-family:var(--body);font-size:15px;font-weight:600;
    color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .link:hover{text-decoration-color:var(--bt-orange)}
  .stack{display:grid;gap:10px;margin-top:20px}
  .nav{margin-top:18px;font-size:15px}
  /* 說明文字：小字、無底色。**橘色框只留給錯誤與狀態訊息**（.wnote）——
     說明跟錯誤共用一種框的時候，有事的那塊框跳不出來，這一頁就沒有輕重。
     顏色用 rgba 不用 opacity：opacity 會連 <b> 一起打折，
     而且 .7 以下過不了對比度。 */
  .note{font-size:13.5px;line-height:1.65;color:rgba(16,42,134,.8);margin-top:16px}
  .note b{color:var(--ink);font-weight:600}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .wnote{font-size:14px;line-height:1.55;margin-bottom:18px;padding:12px 15px;
    background:rgba(255,196,108,.3);border-left:3px solid var(--bt-orange);border-radius:10px}
  .empty{text-align:center;padding:48px 0;color:rgba(16,42,134,.78);font-size:14px}

  /* 登入後的選單 */
  .menu{display:grid;gap:12px}
  .mitem{
    display:block;padding:18px 20px;border:1px solid rgba(16,42,134,.18);border-radius:16px;
    background:rgba(255,255,255,.55);color:var(--ink);text-decoration:none;
    transition:background .15s,border-color .15s;
  }
  .mitem:hover{background:rgba(255,255,255,.85);border-color:rgba(16,42,134,.32)}
  .mitem b{font-family:var(--display);font-size:24px;font-weight:700;display:block;line-height:1.12}
  .mitem span{font-size:13.5px;color:rgba(16,42,134,.78)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- 回首頁的路。外人從對外頁按「登入」進來，得有辦法回去。
     放在 #bt-root 外面：那一層的內容整個由 src/main.js 重畫，
     放進去的話每次重畫都會不見。 -->
<header class="apphead">
  <a href="../" aria-label="回 Beyond Taiwan 首頁">
    <img src="../shared/logo.png" alt="Beyond Taiwan" width="386" height="191">
  </a>
</header>
<div id="bt-root"><div class="empty">載入中…</div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
