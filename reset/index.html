<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重設密碼 — Beyond Taiwan</title>

<!-- 重設密碼頁（規格 §3-6 第 4 點）。
     ⚠ 這一頁的文案是可運作的最小版本，使用者會重寫。改文案時只改 <main> 裡的字，
        狀態機與錯誤處理在 reset.js，不要把文案搬進那裡。

     ── 為什麼放在 /reset/ 而不是護照裡 ──
     使用者點開重設連結的時候是**進不去護照的**（他就是因為進不去才要重設）。
     把它藏在護照的登入流程裡，等於要求一個進不去的人先進去。
     而且它跟角色、跟功能選單都無關，階段 7 做 /app/ 的時候可以原地不動。

     ── 這一頁需要 JavaScript，跟 / 與 /privacy/ 不同 ──
     那兩頁是給不認識 BT 的人讀的文件，不該執行任何程式。
     這一頁是一個功能：它必須讓 supabase-js 從網址接住 recovery token。
     所以它載入 shared/supabase.js，而那兩頁不載入。這個差別是刻意的。

     ── 為什麼不自己解析網址 ──
     這個 client 是 implicit flow（實測 flowType === "implicit"），
     token 走網址的 hash，detectSessionInUrl 會自己接住並觸發 PASSWORD_RECOVERY。
     自己再解一次會有兩份邏輯，而那正是這個 repo 反覆踩到的病根。 -->

<meta name="robots" content="noindex">
<meta name="theme-color" content="#102A86">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../shared/favicon-48.png">
<link rel="apple-touch-icon" href="../shared/apple-touch-icon.png">
<link rel="manifest" href="../shared/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Beyond Taiwan">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/brand.css">

<style>
/* 色票與字體全部來自 ../shared/brand.css，這裡沒有寫死的色碼
   （唯一例外是 head 的 theme-color，meta 吃不了 var）。 */
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 17px/1.7 var(--body);-webkit-font-smoothing:antialiased;
  display:flex;align-items:flex-start;justify-content:center;min-height:100vh}
.card{width:100%;max-width:26em;margin:0 auto;padding:40px 22px 64px}
img.logo{height:30px;display:block;margin:0 0 22px}
h1{font-family:var(--display);font-size:32px;line-height:1.15;margin:0 0 10px}
.sub{margin:0 0 22px;opacity:.85}
p{margin:0 0 16px}
label{display:block;margin:0 0 18px}
label i{display:block;font-style:normal;font-size:14px;font-weight:600;margin:0 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:11px 13px;border:1px solid var(--bt-navy);
  border-radius:var(--r);background:var(--paper);color:var(--ink)}
input:focus-visible{outline:2px solid var(--bt-orange);outline-offset:1px}
/* 2026-09-03（7-4）：跟 /app/ 同一套按鈕規則——實心深藍、display 字體、滿版、方角。
   之前這裡是圓角膠囊、內文字體，跟登入頁長得不一樣；使用者從登入頁點過來會以為到了別的站。 */
.btn{display:block;width:100%;font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;border:none;border-radius:2px;padding:13px 20px;
  background:var(--bt-navy);color:var(--bt-cream);transition:opacity .15s;text-align:center}
.btn:hover{opacity:.86}
.btn[disabled]{opacity:.55;cursor:default}
.btn:focus-visible{outline:2px solid var(--bt-navy);outline-offset:2px}
/* 訊息框跟 /app/ 的 .wnote 同一個樣子：橘底加左邊一條橘線。這一頁的 .note 本來就只給狀態訊息用。 */
.note{background:rgba(255,196,108,.3);border-left:3px solid var(--bt-orange);border-radius:2px;padding:11px 14px;margin:0 0 18px;font-size:15px;line-height:1.55}
.foot{margin-top:32px;padding-top:18px;border-top:1px solid var(--bt-orange);font-size:15px}
a{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ═════════ 點下去要有回饋（2026-09-08）═════════ */
/* 這一段在每一頁都有一份（外殼各自一份的代價），check.sh 有一條在守誰漏了。
   Paul 的要求：「點擊會有回饋」。

   ⚠ **五個登入後的頁面設了 -webkit-tap-highlight-color:transparent**，
   那一行會把手機上唯一的預設回饋關掉。關掉就一定要自己補一個 ——
   在那之前，那五頁在手機上按下去畫面完全不動，
   而**畫面不動的時候使用者會再按一次**（這個 repo 一路上最常見的失敗形狀）。

   ⚠ **不要給它 transition。** 按下去的回饋要立刻發生；
   加了過渡就變成「按了之後才慢慢縮」，那比沒有回饋更像卡住。
   沒有 transition 也表示它不是「會動位置的過渡」，
   對 prefers-reduced-motion 沒有意義 —— 按鍵回饋不是前庭刺激來源。 */
button{cursor:pointer}
button[disabled]{cursor:default}
button:not([disabled]):active,
a.btn:active, a.cta:active, a.login:active, a.photo:active, a.avbtn:active,
summary:active{
  transform:scale(.97);
}
/* 實心的主要按鈕：壓下去再暗一階，光靠縮小在小按鈕上看不太出來。 */
.btn:not([disabled]):not(.ghost):not(.quiet):active,
a.btn:not(.ghost):active, a.cta:active, a.login:active{
  background:var(--bt-navy);color:var(--bt-cream);filter:brightness(.88);
}
/* 框線鈕：壓下去底色再深一點。
   ⚠ **.chip.on 要排除。** 選起來的 chip 底色是深藍，
   蓋一層淺色上去會讓它在按著的時候閃白一下，看起來像取消選取。 */
/* 用橘色不用深藍調淡：深藍 12% 在米白上讀起來是**冷灰**，
   而整站是暖的 —— 那一下按壓會看起來像變髒，不像有回應。
   橘色本來就是這個品牌「正在動的東西」的顏色，而正在被按的就是那個東西。 */
.btn.ghost:not([disabled]):active, .chip:not(.on):active,
.lang:active, .btnav-out:active{
  background:rgba(255,196,108,.38);
}
.chip.on:active{filter:brightness(1.15)}
/* 整行可以點的東西（單選、多選、勾選框）：按著的時候整行變色。
   這些是 <label> 不是 <button>，上面那條抓不到，而它們是**手機上最常按的東西**。 */
.opt:active, .check:active{background:rgba(255,196,108,.26);border-radius:10px}
/* 內文裡的連結不縮放（那會讓一段字在按的時候跳動），改成底線變橘色。 */
.body a:active, .note a:active, footer a:active{text-decoration-color:var(--bt-orange)}
summary{cursor:pointer}
</style>
</head>
<body>

<main class="card" id="root">
  <!-- reset.js 會把這裡整段換掉。這份是「JavaScript 沒跑起來」時看到的東西 ——
       **不要拿掉**：沒有它，關掉 JS 或載入失敗的人看到的是一片空白，
       而空白會被當成網站壞了。 -->
  <img class="logo" src="../shared/logo.png" alt="Beyond Taiwan">
  <h1>重設密碼</h1>
  <p class="sub">這一頁需要 JavaScript 才能運作。</p>
  <div class="note">如果你看到這句話沒有變成密碼輸入框，請換一個瀏覽器再試一次，
  或寄信到 beyondtaiwan2020@gmail.com，我們幫你處理。</div>
  <p class="foot"><a href="../app/">← 回 Beyond Taiwan</a></p>
</main>

<script type="module" src="./reset.js"></script>
</body>
</html>
