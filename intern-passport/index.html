<style>
  /* 色票、字體家族與圓角在 ../shared/brand.css（2026-08-31 階段 2 搬出去的，
     值一個都沒改）。下面所有 var(--bt-navy)、var(--display) 之類都來自那裡。
     **不要在這個檔案裡重新宣告它們**——兩份 token 遲早會不一樣。 */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 2026-09-07：外殼跟對外那一面統一（紙底、右上角的暖光、浮起來的玻璃頂欄、
     藥丸形的按鈕）。**書本本身沒有動** —— 書脊、MRZ、印章那一套是這個產品的身分，
     把它拉平成一般網頁的卡片，等於把護照做沒了。
     換的是外殼，不是內容。 */
  html{overflow-x:clip}
  body{background:var(--paper);overflow-x:clip}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(118% 88% at 80% 4%, var(--bt-sand) 0%, rgba(255,232,197,0) 60%)}
  #bt-root{position:relative;z-index:1;
    font-family:var(--body);
    color:var(--ink);
    line-height:1.55;
    max-width:940px;
    margin:0 auto;
    padding:0 0 40px;
  }
  /* 這條 reset 的選擇器**必須**包在 :where() 裡。
     裸寫 #bt-root button 的特異性是 (1,0,1)，會蓋掉所有用 class 描述外觀的規則 ——
     .btn 的深藍實心底、.btn.ghost 與 .nav .arrow 的外框、.slot 的虛線框、
     .tabs 選中時的深藍底、.photo 的框、.dots 的圓框與蓋滿轉橘，一條都沒有生效過。
     這個站從原型 a2a26c2 到 2026-08-22 為止，畫面上所有按鈕的外觀都是死的，
     唯一看得見的圓點是 .dots [aria-current] 的 outline —— outline 不受 border/background 影響。
     :where() 的特異性恆為零，所以這條規則仍然蓋得過瀏覽器預設樣式
     （作者樣式表無論特異性多低都排在 UA 樣式表前面），但輸給任何一條 class 規則。
     **不要把 :where() 拿掉**，check.sh 有一條檢查在守它。見 spec 2026-08-22 §1。 */
  :where(#bt-root button){font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
  #bt-root :focus-visible{outline:var(--ring);outline-offset:var(--ring-gap)}

  /* ---------- shell ---------- */
  /* 統計列：跟頂欄同一塊玻璃，只是矮一點。 */
  .bar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 20px;margin-bottom:16px;border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(237,229,216,.5));
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(16,42,134,.08);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .bar{background:rgba(255,255,255,.75)}
  }
  .bar img{height:26px;width:auto;display:block}
  .bar .sp{flex:1}
  .tabs{display:flex;border:1px solid rgba(16,42,134,.22);border-radius:999px;overflow:hidden}
  .tabs button{
    font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;padding:6px 14px;color:rgba(16,42,134,.72);
    transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease);
  }
  .tabs button[aria-selected="true"]{background:var(--bt-navy);color:var(--bt-cream)}
  .prog{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1}
  /* ⚠ 用 rgba 指定顏色，不要用 opacity —— opacity 會連對比度一起打折。
     深藍在米白上 .5 只有約 3:1，過不了 WCAG AA。這個 repo 踩過四次。 */
  .prog small{font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;display:block;color:rgba(16,42,134,.78);line-height:1;margin-bottom:4px}

  /* ---------- cover ---------- */
  /* 護照的硬殼（2026-09-08）。Paul 從三個方向裡選了「一本真的護照」。
     那本護照當時最大的問題不是配色，是**形狀**：一張很寬的卡片，
     上面寫著「PAGE 03 / 13」跟「前一頁」，但它讀起來是個 dashboard 不是一本書。
     殼是最便宜也最有效的一半 —— 書一旦有殼，它就是一個東西。

     **書裡面一行都沒有動。** 書脊、針孔、guilloche、MRZ，
     以及入境章那組逐格量出來的幾何（見下面 .estamp 的長註解）全部在原地。
     那組數字是拿 .page 的寬度量的，殼只是在 .page 外面多包一層，
     .page 自己的內距與寬度沒有變，所以不需要回去重量。

     圓角左小右大：裝訂邊（左邊）本來就比書口（右邊）方。
     內距左邊比右邊窄 4px 是同一個理由 —— 裝訂邊的殼包得比較緊。 */
  .cover{
    border-radius:8px 20px 20px 8px;
    padding:13px 15px 13px 11px;
    background:linear-gradient(135deg, var(--bt-navy) 0%, rgba(16,42,134,.84) 46%,
                                       var(--bt-navy) 100%);
    box-shadow:0 30px 62px rgba(16,42,134,.26),0 6px 14px rgba(16,42,134,.16),
               inset 0 1px 0 rgba(255,255,255,.14);
  }

  /* ---------- book ---------- */
  /* 書本外緣加圓角與影子，讓它像一本放在紙上的東西，不是一個貼平的框。
     裡面的書脊、MRZ、印章一律沒動。 */
  .book{
    /* 2026-09-08：書原本是 var(--paper) 實色，跟頁面底色一模一樣，
       所以它讀起來不像一本放在桌上的書，像一塊跟背景融在一起的區域。
       Paul 的原話：「不太符合我們的色調」。
       改成跟站上其他卡片同一套語言：**由上往下、由亮到暗的紙色**，
       再加一道右上角的暖光（那是全站的招牌，見對外頁的 body::before）。
       兩層都只用品牌色與白（check.sh §11-14 的 rgba 底色白名單）。
       **書本身的東西一個都沒有動** —— 書脊、針孔、guilloche、MRZ 都還在。 */
    background:
      radial-gradient(120% 70% at 88% 0%, rgba(255,232,197,.55) 0%, rgba(255,232,197,0) 58%),
      linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.10) 42%, rgba(255,255,255,0) 100%),
      var(--paper);
    /* 2026-09-08：外框與外影交給 .cover（殼在外面，紙不需要自己再有邊）。
       留下的 inset 是紙的上緣反光，那是紙的一部分不是殼的。 */
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
    border:0;
    border-radius:3px 12px 12px 3px;
    position:relative;overflow:hidden;
    /* 2026-09-08：520 → 600。護照是一本比較方的東西，520px 高配上 940px 寬
       讀起來是一張橫幅不是一本書。加高只會多出紙面，不會擠壓任何內容
       （.page 有 flex:1，多的高度是它吸收的）。 */
    min-height:600px;
    /* min-height 讓書維持固定高度，翻頁時大小不變、上一頁／下一頁不會移動。
       但內容比 520px 短的時候，多出來的高度會變成 nav 底下一條空白帶
       （實測：月份頁 44.7px、說明頁 134.2px）。
       改成 flex column 讓 .page 吸收那段高度、nav 貼著書的底部，
       死白就變成頁面自己的餘白，而不是書裡的一個破洞。
       **不要改成「短頁面就拿掉 min-height」** —— 那會讓書在翻到說明頁時變矮，
       上一頁／下一頁按鈕跟著往上跳。會動的東西比死白更糟。 */
    display:flex;flex-direction:column;
  }
  .book::before{ /* 裝訂線 */
    content:"";position:absolute;left:0;top:0;bottom:0;width:9px;
    /* 等距的米白圓點打在深藍上，讀起來像縫線的針孔。
       圓點用 var(--paper) 實色不用 rgba 的米白：check.sh 的 §11-14 只允許三個
       rgba 底色（16,42,134 / 255,196,108 / 255,255,255），米白 237,229,216 那個
       rgba 底色不在允許清單裡，寫了會被擋。
       半徑 1.6px、間距 22px 是配著 9px 的書脊寬挑的 —— 點再大就變成虛線，
       再密就糊成一條淺色帶，兩者都不像針孔。
       opacity 從 .9 拿掉改成 1：原本那條是用來讓深藍不要太實，但現在上面有圓點，
       整條再壓一次會讓圓點也跟著糊掉。深藍本身的份量改用漸層那層的實色控制。 */
    /* 2026-09-08：深藍上再蓋一層由上往下的亮暗，書脊才有「一條裝訂邊」的厚度，
       不是一條平的色帶。針孔與寬度沒有動。 */
    background:
      radial-gradient(circle at 50% 50%, var(--paper) 1.6px, transparent 1.7px) 0 0 / 9px 22px repeat-y,
      linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 30%,
                              rgba(16,42,134,.35) 100%),
      var(--bt-navy);
  }
  .book::after{ /* guilloche：120x40 貼片、每片兩排、四條干涉正弦波，2026-08-23 定案 */
    /* stroke 用 rgba(16,42,134,0.035) 不用 #102A86 + stroke-opacity：
       2026-08-23 實測三種寫法——未編碼的 # 會被瀏覽器當成 data URI 的 fragment，
       圖直接不載入（onerror）；URL 編碼過的色碼能載入，但 check.sh 的 §11-14 hex
       掃描看不到它，等於這段紋路悄悄脫離三色檢查；rgba(16,42,134,...) 能載入，
       而且本來就是 check.sh 允許的三個 rgba 底色之一，三色檢查涵蓋得到。所以不要
       「順手」改回 #102A86 加 stroke-opacity 或改成 URL 編碼，那樣會讓這段紋路
       脫離守備範圍。 */
    /* 調這組參數之前，先把 stroke 的 alpha 臨時改成 0.07 檢查接縫與帶狀感，
       確認乾淨了再改回 0.035——低對比會把接縫缺陷藏起來。第一版每條波只畫在
       貼片中間、帶與帶之間留空隙，重複之後讀成橫條紋，在 3.5% 下完全看不出來，
       拉到 7% 一眼就看到；修法是讓每條波在 cy、cy-H、cy+H 各畫一次跨過上下邊界，
       每片再排兩排、相位錯開。 */

  .page{padding:26px 26px 46px 34px;position:relative;z-index:1;flex:1}
  .page.turn{animation:turn .34s ease}
  @keyframes turn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

  /* 每頁右下角的頁碼。位置絕對定位在 .page 的右下，所以它跟著紙走、不是釘在書上。
     字級 12px、字距拉開、透明度 .35 —— 它是給人確認「翻到哪了」的，不是要被讀的。
     tabular-nums 讓 01 到 13 的數字寬度一致，翻頁時不會左右跳動。
     字體不用指定：.pageno 繼承 #bt-root 的 var(--body) 不對，這裡要 var(--display)
     跟月份數字同一套，所以明寫。 */
  .pageno{
    position:absolute;right:26px;bottom:26px;
    font-family:var(--display);font-size:12px;font-weight:600;
    letter-spacing:.22em;text-transform:uppercase;
    color:rgba(16,42,134,.35);font-variant-numeric:tabular-nums;
    pointer-events:none;
  }

  .nav{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px 10px 34px;border-top:1px solid rgba(16,42,134,.14);
    position:relative;z-index:1;
  }
  .nav button.arrow{
    font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.06em;
    padding:7px 16px;border:1px solid rgba(16,42,134,.25);border-radius:999px;
    transition:background var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease);
  }
  .nav button.arrow:not(:disabled):hover{background:rgba(255,255,255,.7);border-color:rgba(16,42,134,.4)}
  .nav button.arrow:disabled{opacity:.3;cursor:default}
  .dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
  .dots button{width:9px;height:9px;border-radius:50%;border:1px solid rgba(16,42,134,.4)}
  .dots button[data-on="1"]{background:var(--bt-orange);border-color:var(--bt-orange)}
  .dots button[aria-current="true"]{outline:var(--ring);outline-offset:var(--ring-gap)}

  /* ---------- month page ---------- */
  .mhead{display:flex;align-items:flex-end;gap:16px;border-bottom:2px solid var(--bt-navy);padding-bottom:10px;margin-bottom:22px}
  .mnum{font-family:var(--display);font-size:76px;font-weight:700;line-height:.78;letter-spacing:-.02em}
  .mzh{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;margin-bottom:2px}
  /* 說明頁沒有月份數字：那一頁不是月份，00 又已經給了資料頁，硬塞一個符號進去
     只會讓人多看一眼想「這是第幾頁」。少了左邊 76px 的數字，.mhead 的重心會偏，
     所以改用把標題推到數字那一級來補 —— 52px 跟月份頁「09 九月」的視覺重量對得上。
     **只能掛在 .mhead.solo 上。** 直接改 .mzh 的話，月份頁的「九月」與資料頁的
     「持照人資料」會一起變 52px，兩頁的版面都會爆。 */
  .mhead.solo .mzh{font-size:52px;margin-bottom:0}
  .mtheme{margin-left:auto;text-align:right;line-height:1.25}
  .mtheme b{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:.04em;display:block}
  .mtheme span{font-size:10px;font-weight:600;letter-spacing:.2em;opacity:.55;text-transform:uppercase}
  /* 月份頁的右上角放時間數字（07:00），要比主題字大一級才撐得起那個位置，
     並用 tabular-nums 讓每一頁的冒號對齊。字體不用指定：.mtheme b 本來就是
     var(--display)，也就是 Barlow Condensed，跟左邊 76px 的月份數字同一套。
     **不可以直接改 .mtheme b** —— 資料頁的右上角共用同一個元件，
     那裡放的是「BEYOND TAIWAN / Passport · 2026」，跟著變 34px 會撐爆版面。 */
  .mtheme.clock b{font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.02em}

  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  /* 兩個地方的高度不是巧合，是同一條規則的兩個實例 ——
     只有需要留位置給章的格子才是 270，其他都是內容決定高度。
     月份頁的活動格子 270（下面 min-height:270px）、說明頁的三張卡 0
     （.slots.guide .slot）。 */
  /* 2026-09-08：格子從「一個虛線框」改成「紙上的一欄」，上面一條界線分欄。
     理由是章。章是這本護照唯一的酬賞，而它原本被關在一個小框裡蓋在框的中間 ——
     真的護照的章是蓋在紙上的。把框拿掉之後，章直接落在 guilloche 上，
     整頁才讀得出「這張紙被蓋過」。
     **padding 維持 14px 不要動** —— 入境章那組量出來的幾何是拿它算的
     （見下面 .estamp 的長註解：「之後如果調整 .mhead 的高度、.slot 的 padding
     或 .cat 的字級，要回來重量一次」）。 */
  .slot{
    border:0;border-top:1.5px solid rgba(16,42,134,.3);border-radius:0;
    /* 270 → 330（2026-09-08）：書加高到 600 之後，格子還停在 270 的話
       下面會空出一整條死白。這個數字的意思一直是「先留出章的位置」，
       章變大、又會上下錯開，要留的位置本來就跟著變大。 */
    min-height:330px;padding:14px;
    display:flex;flex-direction:column;text-align:left;width:100%;
    transition:border-color var(--dur-2) var(--ease),background var(--dur-2) var(--ease);
    position:relative;
    min-width:0;
  }
  /* 只剩 :hover。.slot 在 2026-08-25 從 button 改成 div（按鈕不能巢狀，翻面按鈕
     必須在格子裡面），div 不是原生可聚焦元素也沒有 tabindex，:focus-visible
     永遠不會命中，留著是死 CSS。鍵盤可及性沒有退化——真正可聚焦的
     .faceopen 與 .flipbtn 已經套用通用的 #bt-root :focus-visible 規則。 */
  .slot:hover{border-top-color:var(--bt-navy);background:rgba(255,196,108,.14)}
  .slot .cat{font-size:9px;font-weight:700;letter-spacing:.2em;opacity:.5;text-transform:uppercase}
  .slot .ttl{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1;margin:5px 0 3px}
  .slot .en{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;opacity:.45}
  .slot .hint{font-size:12.5px;opacity:.62;margin-top:9px}
  .slot .cta{
    margin-top:auto;font-family:var(--display);font-size:15px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;opacity:.35;
  }
  .slot:hover .cta{opacity:.85}
  /* 蓋過章的格子：界線變淡，**不加底色**。加了底色章就又回到「一張小卡片裡」，
     而拿掉框就是為了讓它蓋在紙上。已蓋與未蓋的差別靠章本身，不靠背景。 */
  .slot[data-done="1"]{border-top-color:rgba(16,42,134,.18)}
  /* 背面那行標題是**標籤不是標題**：正面已經有大字標題與章了，背面補這一行是
     為了一年後翻回去看照片時知道那格題目是什麼。刻意比正面的 .ttl 小而淡 ——
     背面的主角是照片與心得（使用者 2026-08-25）。 */
  .slot .btitle{font-size:12px;font-weight:600;letter-spacing:.02em;opacity:.5}
  /* 這裡原本有一條 .slot[data-done="1"] .hint{opacity:.42}，理由是「蓋章之後說明
     留著但淡化，讓標題與章之間的內容連續」（2026-08-23 Task 10）。章移到正面之後
     說明只剩背面一個去處，那個理由已經不存在，而規則還在的話會讓背面唯一的
     識別資訊淡到 .42 —— 那正好是使用者要它可讀的那一行。連同理由一起刪掉。 */

  /* ── 翻面卡（spec 2026-08-25）──
     這是新的視覺元件，是原規格 §3.4 的**明確例外**，使用者 2026-08-25 授權。
     理由：一格要塞五樣東西，蓋完章之後說明變成死重量，而護照本來就是一頁一頁翻的。
     這個例外只涵蓋翻面卡本身，不是「以後可以自由新增元件」的先例。

     .flip 用 grid 把兩面疊在同一格，**容器高度自動是兩面的最大值** ——
     不用 JS 量、不用寫死數字，內容改了也不用回來調。
     2026-08-25 實測：只放正面 88px、只放背面 145px、兩面疊放 145px、翻面前後不跳。

     backface-visibility:hidden 同時擋掉指標事件（實測），所以背面朝外時
     點中央命中的是背面的內容，不需要額外的 pointer-events 補丁。 */
  .slot{perspective:900px}
  .slot .flip{display:grid;flex:1;transform-style:preserve-3d}
  .slot .face{grid-area:1/1;backface-visibility:hidden;display:flex;flex-direction:column}
  .slot .face.back{transform:rotateY(180deg)}
  .slot[data-face="back"] .flip{transform:rotateY(180deg)}
  .slot .faceopen{display:flex;flex-direction:column;text-align:left;width:100%;flex:1}
  /* 翻面按鈕走一般流排在最後、靠右，不用絕對定位 ——
     絕對定位會蓋到照片或心得，而且不計入高度；這樣排它永遠不會重疊。
     44px 是 spec §3.3 的最小點擊區要求（手機誤觸）。 */
  .slot .flipbtn{
    align-self:flex-end;margin-top:auto;min-width:44px;min-height:44px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;opacity:.4;border-radius:999px;
  }
  .slot .flipbtn:hover,.slot .flipbtn:focus-visible{opacity:.9}

  /* 說明頁的三張卡不要固定高度，讓它跟著文案長。
     .slot 的 min-height:270px 是給月份頁的活動格子用的 —— 蓋章前要先留出章的位置，
     所以那邊必須維持。說明頁沒有章，固定高度只會在文案短的時候留一大片空白，
     手機上尤其明顯（一頁只放得下一張半的卡）。
     **不需要也不要加 align-items:stretch**：.slots 是 grid，同一列的項目預設就是拉伸，
     三張卡本來就等高。多寫一條沒有作用的宣告，只會讓下一個人以為它在做事。 */
  .slots.guide .slot{min-height:0}

  /* 說明頁三張卡的標題固定兩行高。三段文案刻意都以同一句開頭（英文版是
     "Once a month"），要的就是並排時第一句對齊；標題一長一短會把說明往下推，
     三張的第一句就錯開了。給標題固定兩行高，說明才會從同一條線開始。
     2.2em 不是隨便挑的：.slot .ttl 的 line-height 是 1.1，兩行正好 2.2em，
     em 對的是元素自己的 font-size，所以字級改了它也跟著對。

     **這條依賴的前提：三欄版面裡最長的標題會折成兩行、而且不超過兩行。**
     2026-08-28 文案改英文後重新實測（真瀏覽器，Barlow Condensed 已載入）：
       視窗 ≥940px（.ttl 251px）→ 三張都只有一行，這條在這個寬度沒有作用，
                                  拿掉也還是齊的（實測 hint 三張都在 191.6）。
       視窗 721–900px           → .ttl 縮到 172.7–237.7px，標題開始折行，
                                  721px 時是 [2,2,1] 行。**這條在這裡是必要的**：
                                  實測拿掉之後鏡頭那張的說明高了 24.2px。
       視窗 ≤720px              → @media 轉成單欄，沒有並排就沒有對齊問題。
     也就是說舊註解寫的「在 251px 放不下」已經不成立（那是中文標題的情況），
     但這條規則本身要留著 —— 它現在守的是 721–900px 那一段。
     哪天標題長到三欄最窄處會折成三行，2.2em 就不夠了，要一起改。

     代價是寬螢幕時三張標題下面各多一行空白 —— 那是對齊的代價，是刻意的。
     **月份頁的 .ttl 不要跟著改**：那裡放的是活動名稱，長度本來就不一，
     而且下面接的是說明與章，沒有要對齊的東西。 */
  .slots.guide .slot .ttl{min-height:2.2em}

  /* CSS 特異性備忘：兩層 class 選擇器（例如 .slots.guide）是 (0,2,0)，
     比 @media 裡單層的 .slots{grid-template-columns:1fr}（(0,1,0)）高 ——
     media query 本身不增加特異性。以後如果哪個 .slots 變體要在手機上
     保留自己的欄位設定，直接寫規則就會贏，不需要 !important。 */

  /* ---------- the stamp ---------- */
  /* 2026-09-08：框拿掉之後章直接坐在紙上，所以它可以（也應該）大一點。
     上緣多留 6px 是讓它跟上面那行說明分開，看起來像事後蓋上去的，
     不像排版排出來的一個元件。 */
  /* ⚠ 高低錯開用 margin-top 不用 transform。transform 只是把畫面上的東西挪走，
     排版位置沒有動 —— 章往下挪 32px 之後會壓在同一格的翻面按鈕上，
     而且不會有任何東西報錯（2026-09-08 第一版就是這樣，最左邊那格的 ↻ 消失了）。
     margin 會把後面的東西一起帶下去，翻面按鈕永遠在章的下面。 */
  .stampwrap{margin:calc(20px + var(--dy,0px)) 0 0;display:flex;justify-content:center;
    padding:6px 0 2px}
  .tilt{transform-origin:center}
  /* 2026-10-17（實習護照自己加的）：格子的英文標題由 Internship team 自己填，長度沒有上限，
     幹部護照那邊的標題是課程組定的、都很短。章歪 5 度之後兩側各多出約 5px，
     標題一長在 390px 的手機上就會頂出格子（check-mobile 抓到的是 4px）。
     所以章最寬只能到格子減 12px，標題太長就在字中間斷行。 */
  .stampwrap .tilt{max-width:calc(100% - 12px)}
  .stamp .s2{overflow-wrap:anywhere}
  .stamp{
    border:2.5px solid currentColor;border-radius:7px;
    padding:9px 14px 7px;text-align:center;
    opacity:.86;filter:url(#bt-ink);
    position:relative;
  }
  .stamp::after{
    content:"";position:absolute;inset:3px;border:1px solid currentColor;border-radius:4px;opacity:.55;
  }
  .stamp .s1{font-size:8.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase}
  .stamp .s2{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.06em;line-height:1.05;margin:1px 0;text-transform:uppercase}
  .stamp .s3{font-size:11px;font-weight:600;letter-spacing:.14em;font-variant-numeric:tabular-nums}
  /* 聚會章：橘底 + 深藍文字與框線（spec §3.1）。原型的 .ink-orange 用了
     不在三色名單裡的第四色，已移除；.stamp 既有的 opacity:.86 在有底色時
     會讓橘底透出紙面，讀起來仍像墨，保留不動。 */
  .stamp.ink-fill{
    color:var(--bt-navy);
    background:var(--bt-orange);
  }
  .ink-navy{color:var(--bt-navy)}
  .stamp.land{animation:land .42s cubic-bezier(.2,1.5,.4,1)}
  @keyframes land{
    0%{transform:scale(2.5) rotate(-14deg);opacity:0}
    55%{transform:scale(.93) rotate(2deg);opacity:.95}
    100%{opacity:.86}
  }
  /* 撕掉這格（Task 7，spec §9.7）。章不是直接消失，是裂成兩半各自往下掉。
     .tearwrap 用 grid 把兩半疊在同一格 —— 跟下面 .slot .flip 疊放正反面
     同一個手法，容器大小自動貼合內容，不用額外量。
     兩半是**同一份章渲染兩次**（見 ui.js 的 stampHTML），各自套一組
     互補的鋸齒 clip-path（逐字照用需求裡給的路徑）與一個方向相反的動畫。
     main.js 只在 prefers-reduced-motion 為否時才會渲染出這個分支；
     reduce 為真時直接刪，不會有 .tearwrap 出現，這裡的動畫也就不會被用到——
     但機器守門（check-motion.mjs）認的是「宣告了 animation 的選擇器」，
     不看使用不使用得到，所以下面 reduce 區塊那一行還是要加。 */
  .tearwrap{display:grid}
  .tearhalf{grid-area:1/1}
  .tearhalf.l{clip-path:polygon(0% 0%,48% 0%,52% 10%,47% 20%,53% 30%,48% 40%,52% 50%,47% 60%,53% 70%,48% 80%,52% 90%,47% 100%,0% 100%);animation:tearL .5s ease forwards}
  .tearhalf.r{clip-path:polygon(48% 0%,100% 0%,100% 100%,47% 100%,52% 90%,48% 80%,53% 70%,47% 60%,52% 50%,48% 40%,53% 30%,47% 20%,52% 10%);animation:tearR .5s ease forwards}
  @keyframes tearL{to{transform:translateY(70px) rotate(-16deg);opacity:0}}
  @keyframes tearR{to{transform:translateY(70px) rotate(16deg);opacity:0}}
  /* 翻面用 animation 不用 transition：main.js 的 render() 是 el.innerHTML = ...，
     整棵子樹每次都被拆掉重建，transition 永遠不會跑（要過渡的元素沒活到下一幀）。
     既有的 .stamp.land 與 .page.turn 會動也正是這個原因。
     **不要「改善」成 transition，也不要為了它去改 render() 的重繪方式**
     —— 那是拿一個穩定的架構去換一個動畫（spec §5.1）。 */
  @keyframes flipToBack{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
  @keyframes flipToFront{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
  /* 這兩個動畫現在只由手動翻面觸發：章移到正面之後（2026-08-25 設計改動，見
     spec §5.2），蓋章不再先翻面，兩段時序的串接已經拿掉。 */
  .flip.turning-back{animation:flipToBack .42s ease}
  .flip.turning-front{animation:flipToFront .42s ease}
  /* top:60px 是量出來的，不是目測。疊印**刻意**壓住右上角的時刻
     （.mtheme.clock）——那是使用者的裁定：真的入境章也會壓到頁碼和邊框，
     章壓過底下的東西是章該有的樣子，不要「修掉」。
     但它**不可以**切到活動格子裡的任何東西。原本 top:70px 時會切掉
     九月三格全蓋滿時第三格（鏡頭 FRAME）分類標籤 .cat 的上半
     （1280px 實測重疊 251.0×5.2px），所以改成 60px，讓分類標籤下方多出 4.8px 餘裕。
     之後如果調整 .mhead 的高度、.slot 的 padding 或 .cat 的字級，
     **要回來重量這個距離**——它是兩個獨立絕對定位/旋轉元素的幾何關係，
     沒有任何測試守得住。 */
  .overprint{
    position:absolute;top:60px;right:26px;z-index:2;pointer-events:none;
    transform:rotate(-11deg);
    color:var(--bt-navy);background:var(--bt-orange);
    opacity:.85;
    border:3px double currentColor;border-radius:4px;padding:3px 13px;
    font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.2em;
    filter:url(#bt-ink);
  }
  .overprint.land{animation:land .5s cubic-bezier(.2,1.5,.4,1)}

  /* 長英文字串與網址要能在任何位置斷行。
     grid 的 1fr 預設不會小於內容的最小寬度，而一串沒有空白的字母的最小寬度
     就是它整串的寬度 —— 於是那一格被撐開，同一列的另外兩格被擠窄
     （實測：158.64 / 633.73 / 129.01，正常是 282 三等分）。

     2026-08-25 實測三種組合（.hint，1280px，無 3D transform 的乾淨路徑）：
       兩個都有                        → 282/282/282，不溢出
       只有 overflow-wrap:anywhere     → 282/282/282，不溢出
       只有 min-width:0                → 282/282/282，但文字溢出格子邊界約 308px
       兩個都沒有                      → 117/611/117，撐開
     原因：overflow-wrap:anywhere 會被計入 min-content 尺寸計算（不同於舊式的
     word-break:break-word），所以它單獨就能讓 grid track 收縮到小於整串字寬。

     兩行都留，但不是「缺一不可」——那是最初這裡寫錯的說法，已被上面的實測推翻。
     真正的理由是防禦深度：overflow-wrap:anywhere 只斷得了「文字」；
     min-width:0 擋的是斷不了的東西——一張比格子寬的圖、一段 <pre>、
     一個 white-space:nowrap 的元素——那些 overflow-wrap 幫不上忙，
     只有 min-width:0 能讓 track 收縮。兩者擋的是不同的東西，只是在
     「長英文字串」這個案例上剛好重疊，讓人誤以為兩者等價。

     **這個 bug 不會有橫向捲軸**，頁面寬度正常，只是三格的比例壞掉，
     所以它不像跑版、只像「這一格怪怪的」。
     中文不會踩到（每個字都能斷），踩到的是英文長字與網址。 */
  .slot .note,.slot .hint{overflow-wrap:anywhere}
  .thumb{width:100%;height:82px;object-fit:cover;border-radius:2px;margin-top:9px;display:block;
    border:1px solid rgba(16,42,134,.2)}

  /* ---------- ID page ---------- */
  .idgrid{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start}
  /* ⚠ 2026-09-08：這一格從 <button> 變成 <a>（上傳搬到 /settings/）。
     **標籤換了，樣式要跟著補**：`:where(#bt-root button)` 那條重設對 <a> 沒有作用，
     所以底線與連結顏色要自己收掉，不然護照上會出現一格藍色底線的照片。 */
  /* 照片：圓角 2px 改成 10px。整站其他地方的圓角都在 12 到 20 之間，
     那個 2px 是唯一一個直角的東西，看起來像沒有跟著改到。
     不用更大的圓角：這一格是證件照，它該看起來像貼上去的一張相片。 */
  .photo{
    width:150px;height:190px;border:1px solid rgba(16,42,134,.28);border-radius:10px;
    background:rgba(255,196,108,.2);display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
    text-decoration:none;color:inherit;cursor:pointer;
  }
  .photo img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.15) contrast(1.05)}
  .photo span{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.5;text-align:center;padding:0 10px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
  .f{border-bottom:1px solid rgba(16,42,134,.18);padding-bottom:5px}
  .f i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.5;display:block}
  .f b{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:.03em;line-height:1.2;display:block}
  .f.wide{grid-column:1/-1}
  /* 2026-09-08：底色從深藍 5% 換成暖色的沙。
     深藍調淡在米白上讀起來是冷灰，那是整頁唯一一塊冷的東西。
     真的護照上那條機讀區本來就是另一種紙色，所以「不一樣」是對的，
     只是它該跟這本書是同一個色系。
     ⚠ **opacity 拿掉，改用 rgba 指定文字顏色。** opacity 會連對比度一起打折，
     這個 repo 已經在七個地方踩過同一件事。.72 在米白上約 5.7:1，過得了 AA。 */
  .motto{font-family:var(--display);font-size:24px;font-weight:500;line-height:1.35;
    margin-top:22px;padding-left:14px;border-left:3px solid var(--bt-orange)}

  /* ---------- 蛇梯棋（2026-10-22）---------- */
  /* 棋盤：5 格一排、蛇形。格子是紙色、任務格沙色、梯子橘框、蛇蒂芬妮綠。棋子是大頭照。
     橘色是「在動的東西」：骰子、正在走的棋子、剛落的那一格。 */
  .bbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 14px}
  /* 棋子的三個調出來的顏色（2026-10-24）：全部從七色 color-mix，不是新色碼。 */
  :root{--pawn-deepteal:color-mix(in srgb,var(--bt-teal) 55%,var(--bt-navy));--pawn-rust:color-mix(in srgb,var(--bt-orange) 55%,var(--bt-navy));--pawn-lime:color-mix(in srgb,var(--bt-yellow) 60%,var(--bt-teal))}
  .bhead .mtheme b{color:var(--bt-navy)}
  .btix b{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.02em}
  .dice{position:relative;width:52px;height:52px;border-radius:12px;background:rgba(255,255,255,.9);
    border:2px solid var(--bt-navy);display:grid;grid-template-columns:repeat(3,1fr);padding:6px;gap:2px;flex:none;
    box-shadow:0 4px 12px rgba(16,42,134,.15)}
  .dice i{display:block;border-radius:50%;background:transparent}
  .dice i.on{background:var(--bt-navy)}
  .dice.rolling{animation:diceroll .6s linear infinite;border-color:var(--bt-navy);background:var(--bt-orange)}
  .dice.rolling i.on{background:var(--bt-navy)}
  @keyframes diceroll{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .bresult{font-size:14px;line-height:1.6;padding:10px 14px;margin:0 0 14px;border-left:3px solid var(--bt-orange);
    background:rgba(255,232,197,.45);border-radius:0 10px 10px 0}
  .bsuggest{margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  /* 棋盤置中（2026-10-24）：頁面寬的時候不要靠左留一片空；蛇梯那一層量的是相對 .bwrap 的座標，置中不影響，resize 會再量。 */
  .bwrap{max-width:560px;position:relative;margin:0 auto}
  .bgrid{display:grid;gap:5px}
  /* 蛇與梯畫在格子上面那一層（2026-10-23）。pointer-events 關掉，底下的任務格還點得到。 */
  .blines{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
  .pawns{z-index:3}
  /* 沿著蛇梯飛的那一顆：浮在最上面，位置由 main.js 一路推。 */
  .pawnfly{position:absolute;left:0;top:0;z-index:4;pointer-events:none;margin:-14px 0 0 -14px}
  .pawnfly .pawn{width:28px;height:28px}
  /* 同一格好幾顆：往左疊、交錯高低，哪一顆都看得到一半以上。 */
  .pawns .pawn:nth-child(n+2){margin-left:-7px}
  .pawns .pawn:nth-child(even){transform:translateY(-5px)}
  .pawns .pawn.me{z-index:1}
  svg.pawn{background:transparent;border:0;box-shadow:none;overflow:visible;filter:drop-shadow(0 2px 3px rgba(16,42,134,.3))}
  svg.pawn.me{filter:drop-shadow(0 0 0 2px var(--bt-orange)) drop-shadow(0 3px 5px rgba(16,42,134,.3))}
  /* 選棋子 */
  .ppick{margin:14px 0 16px;padding:12px 14px;border:1px solid rgba(16,42,134,.18);border-radius:12px;background:rgba(255,255,255,.45)}
  .ppick.first{border-color:var(--bt-orange);background:rgba(255,232,197,.5)}
  .pphead b{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.03em;display:block}
  .pphead span{font-size:12px;color:rgba(16,42,134,.72)}
  .ppgrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .ppbtn{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:7px 4px;border:1px solid rgba(16,42,134,.22);border-radius:10px;
    background:rgba(255,255,255,.6);font-size:10.5px;font-weight:600;color:rgba(16,42,134,.8)}
  .ppbtn svg{width:30px;height:30px;overflow:visible}
  .ppbtn.on{border-color:var(--bt-orange);box-shadow:0 0 0 2px var(--bt-orange);background:rgba(255,232,197,.6);color:var(--ink)}
  .ppbtn.skip{width:auto;justify-content:center;padding:7px 12px}
  .wwho{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(16,42,134,.72);margin:0 0 6px}
  .wrank li{display:flex;align-items:center;gap:10px}
  .wrank .pawn{flex:none;width:26px;height:26px}
  .bq{position:relative;aspect-ratio:1;border:1px solid rgba(16,42,134,.22);border-radius:8px;background:rgba(255,255,255,.5);
    padding:4px 5px;display:flex;flex-direction:column;align-items:flex-start;overflow:hidden}
  .bq[data-act]{cursor:pointer}
  .bq[data-act]:hover{background:rgba(255,196,108,.2)}
  /* 格號 .6 在淡色格子上只有 3.3 到 3.8:1（test/intern-board.test.mjs 算的），拉到 .75 是 4.7 到 5.7:1。 */
  .bq .bn{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.06em;color:rgba(16,42,134,.75);line-height:1}
  .bq .sk{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.02em;margin-top:2px}
  .bq .st{font-size:9.5px;font-weight:600;line-height:1.15;margin-top:2px;overflow-wrap:anywhere;color:var(--ink)}
  .bq .st.done{text-decoration:line-through;color:rgba(16,42,134,.72)}
  .bq.task{background:rgba(255,232,197,.7)}
  .bq.task .st{font-weight:700}
  /* 上色（2026-10-24）：三個分類三個副色，任務格深一點、它後面的空格淡淡的同色（到下一個任務格為止）。
     alpha 是算過的：深藍標題在每一種底上都 >= 8:1，.75 的格號 >= 4.7:1（test/intern-board.test.mjs 用同一條公式守著）。 */
  .bq.z-onboard{background:rgba(107,198,187,.14)}
  .bq.z-project{background:rgba(16,42,134,.06)}
  .bq.z-reflect{background:rgba(255,247,137,.25)}
  .bq.task.c-onboard{background:rgba(107,198,187,.38);border-color:var(--bt-teal)}
  .bq.task.c-project{background:rgba(16,42,134,.16);border-color:var(--bt-navy)}
  .bq.task.c-reflect{background:rgba(255,247,137,.6);border-color:rgba(16,42,134,.35)}
  /* 我在的那一格：柔柔的橘光。剛落的那一格（.lit）亮一點。 */
  .bq.here{box-shadow:0 0 0 2px var(--bt-orange),0 0 16px 4px rgba(255,196,108,.7)}
  .bq.ladder{border-color:var(--bt-orange);background:rgba(255,196,108,.22)}
  .bq.ladder .sk{color:var(--ink)}
  .bq.snake{border-color:var(--bt-teal);background:rgba(107,198,187,.22)}
  .bq.finish{border:2px dashed var(--bt-navy)}
  .bq.lit{box-shadow:0 0 0 3px var(--bt-orange),0 0 20px 6px rgba(255,196,108,.85);background:rgba(255,196,108,.45)}
  .bstart{margin-top:6px;display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(16,42,134,.72)}
  .pawns{position:absolute;right:3px;bottom:3px;display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;max-width:100%}
  .bstart .pawns{position:static}
  .pawn{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:var(--bt-navy);color:var(--bt-cream);
    font-family:var(--display);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
    object-fit:cover;box-shadow:0 2px 6px rgba(16,42,134,.25);line-height:1}
  .pawn.me{width:28px;height:28px;border-color:var(--bt-orange);box-shadow:0 0 0 2px var(--bt-orange),0 3px 8px rgba(16,42,134,.3)}
  .blegend{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:rgba(16,42,134,.78);justify-content:center;flex-wrap:wrap}
  .blegend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid rgba(16,42,134,.22)}
  .blegend .task::before{background:rgba(255,232,197,.9)}
  .blegend .c-onboard::before{background:rgba(107,198,187,.38);border-color:var(--bt-teal)}
  .blegend .c-project::before{background:rgba(16,42,134,.16);border-color:var(--bt-navy)}
  .blegend .c-reflect::before{background:rgba(255,247,137,.6)}
  .blegend .ladder::before{background:rgba(255,196,108,.5);border-color:var(--bt-orange)}
  .blegend .snake::before{background:rgba(107,198,187,.45);border-color:var(--bt-teal)}
  /* 進度牆上的棋盤加名次 */
  .wboard{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:start;margin-bottom:22px}
  .wrank{margin:0;padding:0;list-style:none;font-size:13.5px;line-height:1.5}
  .wrank li{padding:5px 0;border-bottom:1px dotted rgba(16,42,134,.16)}
  .wrank b{display:block;font-family:var(--display);font-size:17px;font-weight:600}
  .wrank span{color:rgba(16,42,134,.75);font-size:12.5px}
  @media (max-width:640px){
    /* 棋盤頁的標題在 375px 會折成兩行，縮一級；右上角那句也縮。 */
    .bhead .mzh{font-size:22px}
    .bhead .mnum{font-size:56px}
    .bhead .mtheme b{font-size:17px}
    .wboard{grid-template-columns:1fr}
    .bq{border-radius:6px;padding:3px 4px}
    .bq .st{display:none}
    .pawn{width:18px;height:18px;font-size:9px}
    .pawn.me{width:24px;height:24px}
  }

  /* ---------- wall ---------- */
  .wall{background:var(--paper);border:1px solid rgba(16,42,134,.18);border-radius:18px;padding:24px 26px;
    box-shadow:0 10px 30px rgba(16,42,134,.07)}
  .wnote{font-size:12px;opacity:.6;margin-bottom:20px;padding:9px 12px;background:rgba(255,196,108,.25);border-radius:2px}
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
  .person{border:1px solid rgba(16,42,134,.16);border-radius:2px;padding:12px 14px;background:rgba(255,255,255,.35)}
  .person b{font-family:var(--display);font-size:21px;font-weight:600;display:block;line-height:1.15}
  .person .team{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.5}
  .track{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;margin-top:10px}
  .track i{height:16px;background:rgba(16,42,134,.1);border-radius:1px;display:block}
  .track i[data-on="1"]{background:var(--bt-orange)}
  .person .cnt{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.06em;margin-top:7px;opacity:.7}
  .feed{margin-top:26px;border-top:1px solid rgba(16,42,134,.15);padding-top:16px}
  .feed h3,.wall h3{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:0 0 12px}
  .fitem{display:flex;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dotted rgba(16,42,134,.16)}
  .fitem time{font-variant-numeric:tabular-nums;opacity:.5;flex:none;font-size:12px;font-weight:600}
  .fitem b{font-weight:600}
  /* 表單欄位底下的一行小字（2026-09-10）。 */
  .fnote{display:block;margin-top:5px;font-size:12px;line-height:1.5;color:rgba(16,42,134,.7)}
  .fnote a{color:var(--ink);font-weight:600}
  /* 第二個名字（2026-09-10）。跟主要的名字同一行、小一級、淡一點 ——
     它是幫你認人的，不是名字本身。見 ui.js 的 namesOf()。 */
  .alt{margin-left:7px;font-family:var(--body);font-size:12.5px;font-weight:400;
    letter-spacing:0;opacity:.62;white-space:nowrap}


  /* ---------- setup / modal ---------- */
  .card{background:var(--paper);border:1px solid rgba(16,42,134,.18);border-radius:18px;padding:30px 28px;max-width:560px;margin:0 auto;
    box-shadow:0 10px 30px rgba(16,42,134,.07)}
  .card h2{font-family:var(--display);font-size:36px;font-weight:700;letter-spacing:.03em;margin:0 0 4px;line-height:1}
  .card .sub{font-size:13px;opacity:.6;margin-bottom:24px}
  label{display:block;margin-bottom:15px}
  label i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.55;display:block;margin-bottom:5px}
  input,select,textarea{transition:border-color var(--dur-2) var(--ease),background var(--dur-2) var(--ease);
    width:100%;font-family:var(--body);font-size:15px;color:var(--ink);
    padding:9px 11px;border:1px solid rgba(16,42,134,.28);border-radius:2px;
    background:rgba(255,255,255,.55);
  }
  input:hover,select:hover,textarea:hover{border-color:rgba(16,42,134,.5)}
  textarea{resize:vertical;min-height:64px}
  /* 2026-09-07：形狀改成藥丸，跟對外那一面的 CTA 一致。
     **按鈕的輕重規則沒有變**（實心深藍是主要動作、ghost 是次要、quiet 是降級）。 */
  .btn{
    font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:12px 24px;border-radius:999px;background:var(--bt-navy);color:var(--bt-cream);
    transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease);
  }
  .btn:hover{background:var(--bt-orange);color:var(--bt-navy);box-shadow:0 8px 22px rgba(16,42,134,.18)}
  .btn.ghost{background:none;color:var(--ink);border:1px solid rgba(16,42,134,.3)}
  .btn.ghost:hover{background:rgba(255,255,255,.7);color:var(--ink)}
  .btn.sm{font-size:15px;padding:7px 14px}
  /* 「清除這本護照」會刪掉一整年的章、心得與照片，而且不可復原
     （clearAll() 真的刪 stamps 與 entries 的列）。它不該跟旁邊那三顆等重 ——
     編輯資料、匯出備份、匯入還原都是可逆的，只有這顆不是。
     拿掉外框、顏色降到 50%、用 margin-left:auto 推到那一列的最右邊，
     跟前三顆之間空出距離。目標是「找得到，但不會手滑按到」。
     **這不是視覺偏好，是安全設計** —— 視覺偏好可以被下一個人推翻，安全設計不行，
     所以 check.sh 有兩條檢查在守它。 */
  /* ⚠ .5 的深藍在米白上只有約 3:1，過不了 WCAG AA 的 4.5:1。
     這顆是「清除這本護照」的安全降級，**要低調但仍然必須讀得到**。 */
  .btn.quiet{background:none;border:none;color:rgba(16,42,134,.78);margin-left:auto}
  .btn.quiet:hover{color:var(--ink)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}

  .scrim{position:fixed;inset:0;background:rgba(16,42,134,.45);display:flex;align-items:center;
    justify-content:center;padding:16px;z-index:50;overflow:auto}
  .modal{background:var(--paper);border-radius:20px;padding:26px;max-width:440px;width:100%;
    border:1px solid rgba(16,42,134,.3);max-height:92vh;overflow:auto}
  .modal h3{font-family:var(--display);font-size:29px;font-weight:700;margin:0 0 2px;line-height:1.05}
  .modal .mt{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.5;margin-bottom:16px}
  .prev{width:100%;max-height:210px;object-fit:cover;border-radius:2px;margin-top:8px;display:block}

  .empty{text-align:center;padding:40px 10px;color:rgba(16,42,134,.78);font-size:14px}
  /* 2026-11-06 自動儲存：編輯資料那張表單欄位旁的小字（改了就存 / 存檔中… / 存好了 / 沒存進去）。
     跟後台 admin/admin.css 末尾那四條一模一樣，只用品牌色的 var()。 */
  .autosave{font-size:13px;color:rgba(16,42,134,.62);white-space:nowrap}
  .autosave.saving{color:rgba(16,42,134,.82)}
  .autosave.saved{color:var(--bt-navy);font-weight:600}
  .autosave.failed{color:var(--ink);font-weight:600;border-left:3px solid var(--bt-orange);padding-left:8px;white-space:normal}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--bt-navy);color:var(--bt-cream);padding:10px 18px;border-radius:2px;
    font-size:13px;font-weight:500;z-index:60;box-shadow:0 6px 22px rgba(16,42,134,.3);
  }

  @media (max-width:720px){
    .slots{grid-template-columns:1fr}
    .slot{min-height:0}
    .idgrid{grid-template-columns:1fr}
    .photo{width:130px;height:164px}
    .fields{grid-template-columns:1fr}
    .mnum{font-size:56px}
    /* 頁碼絕對定位在 .page 右下角，資料頁的按鈕列最右邊正好是「清除這本護照」——
       要留出頁碼那一行的空間，不然兩者會疊在一起。這裡留 40px 夠不夠要看下面
       .pageno 縮到多小的 inset，算式見那條規則的註解。 */
    .page{padding:20px 18px 40px 24px}
    /* 頁碼在手機也要跟著版面的邊界縮進來。桌機的 inset 是 26px，但這裡 .page 的
       padding 是 20/18，頁碼再用 26px 就會比其他東西多縮 8px，跟邊界節奏對不上。
       改成 18/20 之後，需要留的空間是 bottom(20) + 頁碼高度(18.59) = 38.59，
       所以上面那行的 padding-bottom 40px 剛好夠，餘裕 1.4px —— 跟桌機的
       26 + 18.59 = 44.59 對 46px 是同一個餘裕。兩邊對稱不是巧合，是同一條算式。 */
    .pageno{right:18px;bottom:20px}
    .nav{padding-left:24px}
    /* 手機的疊印要縮小並上移。桌機的 21px 疊印在 390px 下橫跨 274px，
       幾乎跟整個頁面一樣寬，會壓到月份數字、月名、還有第一格的分類標籤與標題
       （實測 265.2x10.5 與 265.2x1.3）。
       縮到 13px 之後框變成 183x66，配上 top:26px 剛好落在「九月」與右上角時刻之間。
       **壓住時刻是刻意保留的**（見桌機那條規則的註解），但月名跟格子裡的東西不能碰 ——
       時刻是裝飾，月名是資訊，而手機是三十個幹部主要的使用裝置。
       改動這裡或 .mhead 的任何尺寸之後，要回來重量一次：這是幾何關係，沒有測試守得住。 */
    .overprint{font-size:13px;top:26px}
  }
/* 開頁的「載入中」會呼吸（2026-11-05）。只動透明度，不動位置；reduce 區塊會關掉。 */
.empty.loading{animation:bt-pulse 1.6s ease-in-out infinite}
@keyframes bt-pulse{50%{opacity:.45}}

  @media (prefers-reduced-motion:reduce){
    /* 五個動畫全部關掉：.stamp.land、.page.turn、.overprint.land、
       .flip.turning-back、.flip.turning-front（2026-08-25 翻面加的兩個）。
       .overprint.land 是蓋滿 33 格時「FULL」浮水印的彈跳，
       它跟 .stamp.land 共用同一組 land keyframe，卻一直漏在這條規則外面 ——
       因為它只在集滿的那一刻出現，平常根本測不到。2026-08-18 做 §11-17
       驗收時用 CSSOM 逐條比對才抓到。新增動畫時記得回來加進這一行。
       2026-08-26 加了 .tearhalf.l、.tearhalf.r（Task 7，撕掉這格裂成兩半
       往下掉的動畫）——這個分支 reduce 為真時 main.js 根本不會渲染出來，
       但守門認的是宣告，不是用不用得到，一樣要列進來。 */
    .stamp.land,.page.turn,.overprint.land,.flip.turning-back,.flip.turning-front,.tearhalf.l,.tearhalf.r,.dice.rolling,.empty.loading{animation:none}
  }
/* ═════════ 點下去要有回饋（2026-09-08）═════════ */
/* 這一段在每一頁都有一份（外殼各自一份的代價），check.sh 有一條在守誰漏了。
   Paul 的要求：「點擊會有回饋」。

   ⚠ **五個登入後的頁面設了 -webkit-tap-highlight-color:transparent**，
   那一行會把手機上唯一的預設回饋關掉。關掉就一定要自己補一個 ——
   在那之前，那五頁在手機上按下去畫面完全不動，
   而**畫面不動的時候使用者會再按一次**（這個 repo 一路上最常見的失敗形狀）。

   ⚠ **不要給它 transition。** 按下去的回饋要立刻發生；
   加了過渡就變成「按了之後才慢慢縮」，那比沒有回饋更像卡住。
   沒有 transition 也表示它不是「會動位置的過渡」，
   對 prefers-reduced-motion 沒有意義 —— 按鍵回饋不是前庭刺激來源。 */
button{cursor:pointer}
button[disabled]{cursor:default}
button:not([disabled]):active,
a.btn:active, a.cta:active, a.login:active, a.photo:active, a.avbtn:active,
summary:active{
  transform:scale(.97);
}
/* 實心的主要按鈕：壓下去再暗一階，光靠縮小在小按鈕上看不太出來。 */
.btn:not([disabled]):not(.ghost):not(.quiet):active,
a.btn:not(.ghost):active, a.cta:active, a.login:active{
  background:var(--bt-navy);color:var(--bt-cream);filter:brightness(.88);
}
/* 框線鈕：壓下去底色再深一點。
   ⚠ **.chip.on 要排除。** 選起來的 chip 底色是深藍，
   蓋一層淺色上去會讓它在按著的時候閃白一下，看起來像取消選取。 */
/* 用橘色不用深藍調淡：深藍 12% 在米白上讀起來是**冷灰**，
   而整站是暖的 —— 那一下按壓會看起來像變髒，不像有回應。
   橘色本來就是這個品牌「正在動的東西」的顏色，而正在被按的就是那個東西。 */
.btn.ghost:not([disabled]):active, .chip:not(.on):active,
.lang:active, .btnav-out:active{
  background:rgba(255,196,108,.38);
}
.chip.on:active{filter:brightness(1.15)}
/* 整行可以點的東西（單選、多選、勾選框）：按著的時候整行變色。
   這些是 <label> 不是 <button>，上面那條抓不到，而它們是**手機上最常按的東西**。 */
.opt:active, .check:active{background:rgba(255,196,108,.26);border-radius:10px}
/* 內文裡的連結不縮放（那會讓一段字在按的時候跳動），改成底線變橘色。 */
.body a:active, .note a:active, footer a:active{text-decoration-color:var(--bt-orange)}
summary{cursor:pointer}

  /* 版本提示（2026-11-06）：左下角一條，不會自己消失，按「重新整理」換新版。 */
  .verbar{position:fixed;left:16px;bottom:16px;z-index:70;display:flex;gap:12px;align-items:center;max-width:min(460px,calc(100vw - 32px));
    padding:11px 14px;border-radius:14px;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;
    border:1px solid rgba(16,42,134,.22);border-left:4px solid var(--bt-orange);box-shadow:0 8px 28px rgba(16,42,134,.16)}
  .verbar .btn{flex:none;padding:6px 12px;border-radius:999px;background:var(--bt-navy);color:var(--bt-cream);font-weight:600;cursor:pointer;border:none}
</style>
