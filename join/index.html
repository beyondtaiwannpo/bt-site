<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加入我們 / Beyond Taiwan</title>

<!-- 這一頁在 2026-09-08（批 1）收掉了，只留轉址。

     為什麼不直接刪掉整個資料夾：這個網址在 IG 簡介、簡報與信件裡被貼過，
     刪掉的話那些連結會變成 404。GitHub Pages 沒有伺服器可以設 301，
     所以轉址只能寫在頁面裡：meta refresh 給沒有 JavaScript 的瀏覽器，
     location.replace 給有的（replace 不留下上一頁，不然按上一頁會被彈回來）。

     為什麼原本這一頁要收：它同時對三種人講話（高中生、贊助者、幹部），
     三種人都只讀得到三分之一。現在贊助與合作在 /partner/，高中生看 /programs/，
     幹部走右上角登入。

     2026-09-08（批 3）已經把三個目標改成 ../apply/：meta refresh、
     location.replace、還有下面那個看得見的連結。
     ⚠ 之後再改目標的話**三個都要改**，漏一個的表現是「有時候會跳錯地方」。 -->

<meta http-equiv="refresh" content="0; url=../apply/">
<link rel="canonical" href="https://beyondtaiwannpo.com/apply/">
<meta name="theme-color" content="#EDE5D8">

<link rel="icon" type="image/png" sizes="32x32" href="../shared/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../shared/favicon-48.png">
<link rel="apple-touch-icon" href="../shared/apple-touch-icon.png">
<link rel="manifest" href="../shared/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Beyond Taiwan">

<link rel="stylesheet" href="../shared/brand.css">
<style>
  body{margin:0;background:var(--paper);color:var(--ink);
    font:400 17px/1.75 var(--body);display:grid;place-items:center;min-height:100vh;
    padding:24px;text-align:center}
  img{height:34px;width:auto;display:block;margin:0 auto 22px}
  p{margin:0 0 14px;max-width:26em}
  a{color:var(--ink);font-weight:600;text-underline-offset:3px}
  a:hover{text-decoration-color:var(--bt-orange)}
/* 開了「減少動態效果」就把所有動畫與過渡關掉。
   **這是無障礙需求不是視覺偏好**（2026-08-25 裁定），check-motion.mjs 守著。
   這三頁 2026-09-08 之前完全沒有這個區塊 —— 是那支守門的範圍
   從 passport 一頁擴到全站之後才露出來的。 */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}

/* ═════════ 點下去要有回饋（2026-09-08）═════════ */
/* 這一段在每一頁都有一份（外殼各自一份的代價），check.sh 有一條在守誰漏了。
   Paul 的要求：「點擊會有回饋」。

   ⚠ **五個登入後的頁面設了 -webkit-tap-highlight-color:transparent**，
   那一行會把手機上唯一的預設回饋關掉。關掉就一定要自己補一個 ——
   在那之前，那五頁在手機上按下去畫面完全不動，
   而**畫面不動的時候使用者會再按一次**（這個 repo 一路上最常見的失敗形狀）。

   ⚠ **不要給它 transition。** 按下去的回饋要立刻發生；
   加了過渡就變成「按了之後才慢慢縮」，那比沒有回饋更像卡住。
   沒有 transition 也表示它不是「會動位置的過渡」，
   對 prefers-reduced-motion 沒有意義 —— 按鍵回饋不是前庭刺激來源。 */
button{cursor:pointer}
button[disabled]{cursor:default}
button:not([disabled]):active,
a.btn:active, a.cta:active, a.login:active, a.photo:active, a.avbtn:active,
summary:active{
  transform:scale(.97);
}
/* 實心的主要按鈕：壓下去再暗一階，光靠縮小在小按鈕上看不太出來。 */
.btn:not([disabled]):not(.ghost):not(.quiet):active,
a.btn:not(.ghost):active, a.cta:active, a.login:active{
  background:var(--bt-navy);color:var(--bt-cream);filter:brightness(.88);
}
/* 框線鈕：壓下去底色再深一點。
   ⚠ **.chip.on 要排除。** 選起來的 chip 底色是深藍，
   蓋一層淺色上去會讓它在按著的時候閃白一下，看起來像取消選取。 */
/* 用橘色不用深藍調淡：深藍 12% 在米白上讀起來是**冷灰**，
   而整站是暖的 —— 那一下按壓會看起來像變髒，不像有回應。
   橘色本來就是這個品牌「正在動的東西」的顏色，而正在被按的就是那個東西。 */
.btn.ghost:not([disabled]):active, .chip:not(.on):active,
.lang:active, .btnav-out:active{
  background:rgba(255,196,108,.38);
}
.chip.on:active{filter:brightness(1.15)}
/* 整行可以點的東西（單選、多選、勾選框）：按著的時候整行變色。
   這些是 <label> 不是 <button>，上面那條抓不到，而它們是**手機上最常按的東西**。 */
.opt:active, .check:active{background:rgba(255,196,108,.26);border-radius:10px}
/* 內文裡的連結不縮放（那會讓一段字在按的時候跳動），改成底線變橘色。 */
.body a:active, .note a:active, footer a:active{text-decoration-color:var(--bt-orange)}
summary{cursor:pointer}
</style>
</head>
<body>
<main>
  <a href="../"><img src="../shared/logo.png" alt="Beyond Taiwan" width="386" height="191"></a>
  <p>這一頁搬家了。</p>
  <p lang="en">This page has moved.</p>
  <p><a href="../apply/">前往「現在開放」 / Go to what is open</a></p>
</main>
<script>location.replace("../apply/");</script>
</body>
</html>
