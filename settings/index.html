<!-- 這四支是登入後每一頁都一定會用到的，而且它們躺在相依鏈的**第三層**：
     瀏覽器要先下載 src/main.js，才知道要 shared/auth.js，再才知道要 vendor/supabase-js.js

     在本機看不出來，在真實網路上就是三次等待疊在「載入中…」那個畫面後面。
     modulepreload 讓瀏覽器一開始就同時去抓，不用一層一層發現。
     ⚠ 這不是快取或打包工具，是瀏覽器原生的一行 HTML —— 沒有 build step。
     ⚠ 路徑改動的話這幾行要跟著改，否則瀏覽器會抓一個 404 回來（不會壞，但白費一次請求）。 -->

<!-- 這一頁自己的模組。上面三行解決的是共用那一層，這幾行解決第二層：
     瀏覽器要先把 src/main.js 下載完、解析完，才知道它還要 ./src/ui.js 之類的東西，
     那又是一次完整的網路來回疊在「載入中…」後面。這幾行讓它一開始就一起抓。
     ⚠ 檔名改了、或這一頁不再 import 某一支，這裡要跟著改 ——
     check.sh 會檢查每一個 modulepreload 指到的檔案真的存在。 -->

<link rel="stylesheet" href="../shared/nav.css?v=2026-10-29-0036">
<style>
  /* 色票、字體、圓角全部來自 ../shared/brand.css，這裡一個都不重新宣告。 */
  /* 外殼從 availability/index.html 複製過來，跟 admin/ 同一個做法。
     **刻意各自一份，不要搬進 shared/** —— 規格說 shared/ 要保持極小。 */
  html{overflow-x:clip}
  body{background:var(--paper);overflow-x:clip}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(118% 88% at 80% 4%, var(--bt-sand) 0%, rgba(255,232,197,0) 60%)}
  #bt-root{position:relative;z-index:1}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #bt-root{font-family:var(--body);color:var(--ink);line-height:1.55;max-width:940px;margin:0 auto;padding:14px 12px 60px}
  /* :where() 是必要的，不是風格 —— 見 passport/index.html 同一條的註解。 */
  :where(#bt-root button){font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
  #bt-root :focus-visible{outline:var(--ring);outline-offset:var(--ring-gap)}

  /* 這一條玻璃只裝分頁鈕（logo 與登出在 shared 的頂欄）。
     不加 width:fit-content 的話它會拉滿 940px，右邊三分之二是空的，
     看起來像少畫了東西。護照那一條右邊還有集章進度，所以那邊是滿版。 */
  .bar{display:flex;width:fit-content;max-width:100%;
    align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;
    border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(237,229,216,.5));
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(16,42,134,.08)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .bar{background:rgba(255,255,255,.75)}
  }
  .bar img{height:24px;width:auto;display:block}
  .bar .sp{flex:1}
  .tabs{display:flex;border:1px solid rgba(16,42,134,.22);border-radius:999px;overflow:hidden}
  .tabs button{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.06em;
    padding:6px 12px;color:rgba(16,42,134,.55);transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease)}
  .tabs button[aria-current]{background:var(--bt-navy);color:var(--bt-cream)}
  .weeknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
  .weeknav b{font-family:var(--display);font-size:18px;letter-spacing:.04em}

  .card{background:var(--paper);border:1px solid rgba(16,42,134,.18);border-radius:18px;padding:24px 22px;
    box-shadow:0 10px 30px rgba(16,42,134,.07)}
  .card h2{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.03em;margin:0 0 4px;line-height:1.05}
  /* ⚠ 用 rgba 指定顏色不要用 opacity —— opacity 會連對比度一起打折。
     深藍在米白上 .6 只有約 3.6:1，過不了 AA 的 4.5:1。這個 repo 踩過四次。 */
  .card .sub{font-size:13.5px;color:rgba(16,42,134,.8);margin-bottom:18px}
  .card p{font-size:14px;margin:0 0 12px}
  label{display:block;margin-bottom:14px}
  label i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(16,42,134,.8);display:block;margin-bottom:5px}
  input,select{transition:border-color var(--dur-2) var(--ease),background var(--dur-2) var(--ease);width:100%;font-family:var(--body);font-size:15px;color:var(--ink);padding:8px 10px;
    border:1px solid rgba(16,42,134,.28);border-radius:12px;background:rgba(255,255,255,.7)}
  input:hover,select:hover,textarea:hover{border-color:rgba(16,42,134,.5)}
  select{width:auto;min-width:96px}
  .btn{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:11px 22px;border-radius:999px;background:var(--bt-navy);color:var(--bt-cream);
    transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease)}
  .btn:hover{background:var(--bt-orange);color:var(--bt-navy);box-shadow:0 8px 22px rgba(16,42,134,.18)}
  .btn[disabled]{opacity:.4;cursor:default}
  .btn.ghost{background:none;color:var(--ink);border:1px solid rgba(16,42,134,.3)}
  .btn.sm{font-size:14px;padding:6px 12px}
  .btn.quiet{background:none;border:none;color:rgba(16,42,134,.55);text-transform:none;letter-spacing:0;
    font-family:var(--body);font-size:14px;font-weight:600;padding:2px 4px;text-decoration:underline}
  .btn.quiet:hover{color:var(--ink)}
  a.btn{text-decoration:none;display:inline-block}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .wnote{font-size:12.5px;padding:10px 14px;background:rgba(255,196,108,.25);border-radius:12px}
  /* 校友的歡迎卡（2026-11-07）：橘邊的一張小卡，三件事一條一條，按掉就不再出現。 */
  .welcome{margin:0 0 20px;padding:16px 18px;border:1px solid rgba(255,196,108,.6);border-left:5px solid var(--bt-orange);border-radius:14px;background:rgba(255,196,108,.14)}
  .welcome h3{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.03em;margin:0 0 6px;line-height:1.1}
  .welcome p{margin:0 0 8px;font-size:14px}
  .welcome ol{margin:0 0 10px;padding-left:20px;font-size:14px;line-height:1.6}
  .welcome li{margin:0 0 6px}
  .welcome .row{display:flex;gap:10px;flex-wrap:wrap}
  .wnote.big{font-size:15px;opacity:1;padding:14px 16px;margin-bottom:14px}
  .empty{text-align:center;padding:40px 0;color:rgba(16,42,134,.78);font-size:14px}
  .empty.sm{padding:14px 0}
  .mini{font-size:12.5px;color:rgba(16,42,134,.8)}


  /* ---------- 設定 ---------- */
  .sec-h{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.03em;
    margin:30px 0 6px;color:rgba(16,42,134,.92)}
  .sec-h:first-of-type{margin-top:4px}
  .sec-note{font-size:13.5px;line-height:1.65;color:rgba(16,42,134,.82);margin:0 0 14px}
  select{width:100%;font-family:var(--body);font-size:15.5px;color:var(--ink);
    padding:11px 13px;border:1px solid rgba(16,42,134,.28);border-radius:12px;
    background:rgba(255,255,255,.7)}
  select:focus-visible{outline:var(--ring);outline-offset:var(--ring-gap);border-color:transparent}
  /* ⚠ input{width:100%} 會把打勾的方框拉成滿版的一條。改上面那條規則前先想到這一格。 */
  /* 所屬 team 的複選（2026-09-10）。一個人可以在好幾個 team。
     用 fieldset/legend 而不是一個 <i> 標籤：讀螢幕的人聽到的會是
     「所屬 team，可以選好幾個，六個項目」，而不是六個沒有上下文的勾。 */
  .teams{border:0;margin:0 0 16px;padding:0;min-width:0}
  .teams legend{padding:0;font-size:12px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:rgba(16,42,134,.78);margin-bottom:8px}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));
    gap:2px 14px}
  .tgrid .check{margin:0}
  .check{display:flex;gap:11px;align-items:flex-start;margin:0 0 14px;padding:4px 0;
    font-size:14.5px;line-height:1.6;cursor:pointer}
  .check input[type="checkbox"]{width:19px;height:19px;flex:none;margin:2px 0 0;
    accent-color:var(--bt-navy);cursor:pointer}

  /* 英文版那一折。summary 的樣式全站一致，不另外發明一個。 */
  .enfold{margin:0 0 16px}
  .enfold summary{font-size:13.5px;font-weight:600;color:rgba(16,42,134,.8);padding:6px 0}

  /* 大頭照：**照片跟「要不要公開」放在同一個畫面上**。
     設定的地方跟後果的地方距離太遠，人就不知道自己在公開什麼。 */
  .avrow{display:flex;gap:18px;align-items:center;margin-bottom:14px}
  .avbtn{flex:none;width:92px;height:92px;border-radius:50%;overflow:hidden;
    border:1px solid rgba(16,42,134,.22);background:rgba(255,255,255,.6);
    display:grid;place-items:center;padding:0}
  .avbtn img{width:100%;height:100%;object-fit:cover;object-position:center 28%;display:block}
  .avbtn span{font-size:12px;line-height:1.4;color:rgba(16,42,134,.7)}
  .avside{min-width:0;font-size:13.5px;line-height:1.6;color:rgba(16,42,134,.82)}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  @media (max-width:560px){ .two{grid-template-columns:1fr} .avrow{flex-wrap:wrap} }
  /* 2026-11-06 自動儲存：整頁那條黏在底部的「存起來」列拿掉了（原本 .saverow），
     改成每一區底下一行小字 .autorow（「改了就存 / 存檔中… / 存好了 / 沒存進去」）。
     .autosave 四種狀態跟後台 admin/admin.css 末尾那四條一模一樣，只用品牌色的 var()。 */
  .autorow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px solid rgba(16,42,134,.14)}
  .savenote{font-size:13px;color:rgba(16,42,134,.7)}
  @media (max-width:560px){ .savenote{font-size:12.5px} }
  .autosave{font-size:13px;color:rgba(16,42,134,.62);white-space:nowrap}
  .autosave.saving{color:rgba(16,42,134,.82)}
  .autosave.saved{color:var(--bt-navy);font-weight:600}
  .autosave.failed{color:var(--ink);font-weight:600;border-left:3px solid var(--bt-orange);padding-left:8px;white-space:normal}
  /* 自動存的結果用 toast 講（卡片最上面那條 wnote 要重畫才看得到，自動存時不重畫）。跟護照頁同一個形狀。 */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--bt-navy);color:var(--bt-cream);padding:10px 18px;border-radius:2px;
    font-size:13px;font-weight:500;z-index:60;box-shadow:0 6px 22px rgba(16,42,134,.3);
    max-width:min(560px,calc(100vw - 32px));
  }
  .danger{margin-top:30px;border-top:1px solid rgba(16,42,134,.14);padding-top:18px}
/* 開了「減少動態效果」就把所有動畫與過渡關掉。
   **這是無障礙需求不是視覺偏好**（2026-08-25 裁定），check-motion.mjs 守著。
   這三頁 2026-09-08 之前完全沒有這個區塊 —— 是那支守門的範圍
   從 passport 一頁擴到全站之後才露出來的。 */
/* 開頁的「載入中」會呼吸（2026-11-05）。只動透明度，不動位置；reduce 區塊會關掉。 */
.empty.loading{animation:bt-pulse 1.6s ease-in-out infinite}
@keyframes bt-pulse{50%{opacity:.45}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}

/* ═════════ 點下去要有回饋（2026-09-08）═════════ */
/* 這一段在每一頁都有一份（外殼各自一份的代價），check.sh 有一條在守誰漏了。
   Paul 的要求：「點擊會有回饋」。

   ⚠ **五個登入後的頁面設了 -webkit-tap-highlight-color:transparent**，
   那一行會把手機上唯一的預設回饋關掉。關掉就一定要自己補一個 ——
   在那之前，那五頁在手機上按下去畫面完全不動，
   而**畫面不動的時候使用者會再按一次**（這個 repo 一路上最常見的失敗形狀）。

   ⚠ **不要給它 transition。** 按下去的回饋要立刻發生；
   加了過渡就變成「按了之後才慢慢縮」，那比沒有回饋更像卡住。
   沒有 transition 也表示它不是「會動位置的過渡」，
   對 prefers-reduced-motion 沒有意義 —— 按鍵回饋不是前庭刺激來源。 */
button{cursor:pointer}
button[disabled]{cursor:default}
button:not([disabled]):active,
a.btn:active, a.cta:active, a.login:active, a.photo:active, a.avbtn:active,
summary:active{
  transform:scale(.97);
}
/* 實心的主要按鈕：壓下去再暗一階，光靠縮小在小按鈕上看不太出來。 */
.btn:not([disabled]):not(.ghost):not(.quiet):active,
a.btn:not(.ghost):active, a.cta:active, a.login:active{
  background:var(--bt-navy);color:var(--bt-cream);filter:brightness(.88);
}
/* 框線鈕：壓下去底色再深一點。
   ⚠ **.chip.on 要排除。** 選起來的 chip 底色是深藍，
   蓋一層淺色上去會讓它在按著的時候閃白一下，看起來像取消選取。 */
/* 用橘色不用深藍調淡：深藍 12% 在米白上讀起來是**冷灰**，
   而整站是暖的 —— 那一下按壓會看起來像變髒，不像有回應。
   橘色本來就是這個品牌「正在動的東西」的顏色，而正在被按的就是那個東西。 */
.btn.ghost:not([disabled]):active, .chip:not(.on):active,
.lang:active, .btnav-out:active{
  background:rgba(255,196,108,.38);
}
.chip.on:active{filter:brightness(1.15)}
/* 整行可以點的東西（單選、多選、勾選框）：按著的時候整行變色。
   這些是 <label> 不是 <button>，上面那條抓不到，而它們是**手機上最常按的東西**。 */
.opt:active, .check:active{background:rgba(255,196,108,.26);border-radius:10px}
/* 內文裡的連結不縮放（那會讓一段字在按的時候跳動），改成底線變橘色。 */
.body a:active, .note a:active, footer a:active{text-decoration-color:var(--bt-orange)}
summary{cursor:pointer}
/* 中英切換（2026-10-19）：「我的資料」上面兩顆小按鈕，現在的那一顆深藍底。
   這一頁是切換鈕唯一的家（頂欄只是導覽，不放），其他登入後的頁面跟著這裡選的走。 */
.langrow{display:flex;gap:6px;align-items:center;margin:0 0 18px}
.langrow .lang{min-height:32px;padding:0 14px;border:1px solid rgba(16,42,134,.3);border-radius:999px;
  background:rgba(255,255,255,.55);color:var(--ink);font:600 13px/1 var(--body);cursor:pointer}
.langrow .lang.on{background:var(--bt-navy);color:var(--bt-cream);border-color:var(--bt-navy)}
.langrow .lang:focus-visible{outline:var(--ring);outline-offset:var(--ring-gap)}
.langrow .langlbl{font-size:12.5px;color:rgba(16,42,134,.75);margin-right:4px}

  /* 版本提示（2026-11-06）：左下角一條，不會自己消失，按「重新整理」換新版。 */
  .verbar{position:fixed;left:16px;bottom:16px;z-index:70;display:flex;gap:12px;align-items:center;max-width:min(460px,calc(100vw - 32px));
    padding:11px 14px;border-radius:14px;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;
    border:1px solid rgba(16,42,134,.22);border-left:4px solid var(--bt-orange);box-shadow:0 8px 28px rgba(16,42,134,.16)}
  .verbar .btn{flex:none;padding:6px 12px;border-radius:999px;background:var(--bt-navy);color:var(--bt-cream);font-weight:600;cursor:pointer;border:none}
  /* ── 滑過與按下，補齊（2026-10-28 Paul：每個能按的東西都要有效果）。滑過淺橘、按下主橘。 ── */
  .btn.quiet:hover{background:none;box-shadow:none}
  .check:hover{background:rgba(255,232,197,.5);border-radius:10px}
  .lang:not(.on):hover{background:rgba(255,255,255,.9);border-color:var(--bt-navy)}
  .avbtn:hover{border-color:var(--bt-orange);box-shadow:0 0 0 3px rgba(255,196,108,.35)}
</style>
</head>
