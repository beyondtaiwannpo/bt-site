<title>BT Planet (prototype)</title>

<!-- BT 星球原型（2026-11-19）

     為什麼有這一頁：幹部覺得 /island/ 跟 HEART 政策島太像。Paul 要幾個別的呈現方式，五個裡面他先要看「小星球」。
     這一頁只是原型，拿來給幹部比較、投票，不是正式頁面，也還沒有接到選單。

     跟 /island/ 一樣的：資料就是 island/teams.json（team、在做的事、協作線、校友範例），人在上面走來走去，點一個地方開一張卡。
     跟 /island/ 不一樣的：
       - 一顆可以轉的小星球，不是海上的一群島。聚會所在北極，六個 team 繞著星球排一圈，機場在南半球。
       - 每個地方都有路接起來：聚會所到每個 team 一條，六個 team 之間一圈環狀路，機場接最近的兩個 team。人沿著路走去別的 team，走到星球另一面就看不到了。
       - 畫風改成平塗的海報風：米白紙的背景、深藍描邊、兩三階的色塊陰影，不是 HEART 那種柔和的玩具感。人也不是大頭小人，是細長的剪影。
     人都是示意：每個 team 四位「幹部（示意）」，加上 teams.json 裡本來就有的校友與學員範例。不顯示任何名字。
     沒做的：把自己放上去、鍵盤逐一瀏覽建築、正式頁的效能守門。 -->

<script type="module">
import * as THREE from "three";

// ---------- 字 ----------
const S = {
  proto: { zh: "原型", en: "Prototype" },
  all: { zh: "看全貌", en: "Whole planet" },
  pause: { zh: "暫停", en: "Pause" },
  play: { zh: "繼續", en: "Play" },
  lang: { zh: "EN", en: "中文" },
  hint: { zh: "拖曳轉動星球，點一個地方看看", en: "Drag to spin. Tap a place to look closer." },
  close: { zh: "關閉", en: "Close" },
  doing: { zh: "這裡在做的事", en: "What happens here" },
  works: { zh: "一起做事的 team", en: "Works with" },
  here: { zh: "現在在這裡的人", en: "Here right now" },
  open: { zh: "打開", en: "Open" },
  member: { zh: "幹部（示意）", en: "Team member (placeholder)" },
  livesOn: { zh: "住在", en: "Lives at" },
  goingTo: { zh: "正要去", en: "On the way to" },
  visiting: { zh: "正在拜訪", en: "Visiting" },
  note: { zh: "這是原型。人都是示意，不是真的幹部，也不顯示名字。", en: "Prototype. People are placeholders, not real members, and no names are shown." },
  nogl: { zh: "這台裝置打不開 3D。", en: "This device cannot show 3D." },
  people: { zh: "人", en: "people" },
};
let lang = document.documentElement.getAttribute("data-lang") || "zh";
const T = (k) => S[k][lang];
const L = (o, k) => o[k + "_" + lang] || o[k + "_en"] || o[k + "_zh"] || "";

// ---------- 常數 ----------
const C = { cream: 0xEDE5D8, sand: 0xFFE8C5, orange: 0xFFC46C, grey: 0xC6C6C6, navy: 0x102A86, teal: 0x6BC6BB, yellow: 0xFFF789 };
const R = 10, CAP = 0.30, WANDER = CAP * 0.42, RING = CAP * 0.68;
const D2R = Math.PI / 180, TAU = Math.PI * 2, YV = new THREE.Vector3(0, 1, 0);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches || /motion=off/.test(location.search);
let paused = reduce;
let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

const data = await fetch("../../island/teams.json").then((r) => r.json());
const teams = data.teams;
const byId = Object.fromEntries(teams.map((t) => [t.id, t]));

const ok = (() => { try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (e) { return false; } })();

// ---------- 球面的小工具 ----------
const dirFrom = (lat, lon) => new THREE.Vector3(Math.cos(lat * D2R) * Math.sin(lon * D2R), Math.sin(lat * D2R), Math.cos(lat * D2R) * Math.cos(lon * D2R));
function frame(up) {
  const ref = Math.abs(up.y) > 0.99 ? new THREE.Vector3(0, 0, 1) : YV;
  const east = new THREE.Vector3().crossVectors(ref, up).normalize();
  const north = new THREE.Vector3().crossVectors(up, east);
  return { up, east, north };
}
function offsetDir(f, bearing, ang) {
  const v = f.north.clone().multiplyScalar(Math.cos(bearing)).addScaledVector(f.east, Math.sin(bearing));
  return f.up.clone().multiplyScalar(Math.cos(ang)).addScaledVector(v, Math.sin(ang)).normalize();
}
function bearingTo(f, target) {
  const t = target.clone().addScaledVector(f.up, -f.up.dot(target));
  return Math.atan2(t.dot(f.east), t.dot(f.north));
}
function slerpDir(a, b, t) {
  const ang = a.angleTo(b); if (ang < 1e-6) return a.clone();
  const s = Math.sin(ang);
  return a.clone().multiplyScalar(Math.sin((1 - t) * ang) / s).addScaledVector(b, Math.sin(t * ang) / s);
}
function arcPts(a, b, step = 0.025) {
  const n = Math.max(1, Math.ceil(a.angleTo(b) / step)); const out = [];
  for (let i = 0; i <= n; i++) out.push(slerpDir(a, b, i / n));
  return out;
}
const angDiff = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));

// ---------- 地方：聚會所在北極，六個 team 一圈，機場在南半球 ----------
const outer = teams.filter((t) => t.id !== "commons" && !t.sea);
const place = {}, lonOf = {};
place.commons = new THREE.Vector3(0, 1, 0);
outer.forEach((t, i) => { lonOf[t.id] = i * 60; place[t.id] = dirFrom(22, i * 60); });
const airport = teams.find((t) => t.sea);
if (airport) place[airport.id] = dirFrom(-36, 30);
const frames = Object.fromEntries(Object.entries(place).map(([k, v]) => [k, frame(v)]));

// 路：聚會所到每個 team、六個 team 一圈、機場接最近的兩個 team
const roads = [];
outer.forEach((t) => roads.push({ a: "commons", b: t.id, pts: arcPts(place.commons, place[t.id]) }));
outer.forEach((t, i) => {
  const u = outer[(i + 1) % outer.length]; const pts = [];
  for (let k = 0; k <= 48; k++) pts.push(dirFrom(22, lonOf[t.id] + 60 * k / 48));
  roads.push({ a: t.id, b: u.id, pts });
});
if (airport) {
  const near = outer.map((t) => [t.id, place[t.id].angleTo(place[airport.id])]).sort((x, y) => x[1] - y[1]).slice(0, 2);
  near.forEach(([id]) => roads.push({ a: airport.id, b: id, pts: arcPts(place[airport.id], place[id]) }));
}
const adj = {}; Object.keys(place).forEach((k) => adj[k] = []);
roads.forEach((r) => { adj[r.a].push({ to: r.b, r, rev: false }); adj[r.b].push({ to: r.a, r, rev: true }); });
function route(from, to) {
  const prev = { [from]: null }, q = [from];
  while (q.length) { const n = q.shift(); if (n === to) break; for (const e of adj[n]) if (!(e.to in prev)) { prev[e.to] = { n, e }; q.push(e.to); } }
  if (!(to in prev)) return null;
  const out = []; let n = to; while (prev[n]) { out.unshift(prev[n].e); n = prev[n].n; }
  return out;
}

// ---------- 沒有 WebGL：只留文字 ----------
const $ = (s) => document.querySelector(s);
if (!ok) { $("#nogl").style.display = "block"; }

// ---------- 場景 ----------
const stage = $("#stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(C.cream);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 400);
scene.add(new THREE.AmbientLight(0xffffff, 1.35));
const sunLight = new THREE.DirectionalLight(0xffffff, 2.1); sunLight.position.set(-14, 16, 18); scene.add(sunLight);

const grad = new THREE.DataTexture(new Uint8Array([95, 95, 95, 255, 175, 175, 175, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const mats = new Map();
const toon = (c) => { if (!mats.has(c)) mats.set(c, new THREE.MeshToonMaterial({ color: c, gradientMap: grad })); return mats.get(c); };
const flat = (c) => new THREE.MeshBasicMaterial({ color: c });
const INK = new THREE.MeshBasicMaterial({ color: C.navy, side: THREE.BackSide });
const mix = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), t).getHex();
function inked(geo, colour, s = 1.07) { const m = new THREE.Mesh(geo, toon(colour)); const h = new THREE.Mesh(geo, INK); h.scale.setScalar(s); m.add(h); return m; }

// 背景的太陽：一個平塗的橘色圓，固定在畫面後方
const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(8, 64), flat(C.orange)); sunDisc.position.set(-17, 12, -50); scene.add(sunDisc);
const sunRing = new THREE.Mesh(new THREE.RingGeometry(9.4, 9.75, 96), flat(C.navy)); sunRing.position.copy(sunDisc.position); scene.add(sunRing);

const world = new THREE.Group(); scene.add(world);
world.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), 0.32);

// 星球本體與描邊
const planet = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 64), toon(C.sand)); world.add(planet);
const rim = new THREE.Mesh(new THREE.SphereGeometry(R * 1.012, 64, 48), INK); world.add(rim);

// 球冠（地方與湖）：一塊略高於地面的圓，下面墊一圈深藍當描邊
function cap(dir, ang, colour, lift = 0.012) {
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.SphereGeometry(R + lift, 64, 6, 0, TAU, 0, ang), toon(colour));
  const edge = new THREE.Mesh(new THREE.SphereGeometry(R + lift * 0.6, 64, 6, 0, TAU, 0, ang + 0.012), flat(C.navy));
  g.add(edge, top); g.quaternion.setFromUnitVectors(YV, dir); world.add(g);
  return top;
}
const colourOf = (t) => C[t.colour] ?? C.grey;
const capMesh = {};
for (const [id, dir] of Object.entries(place)) {
  const t = byId[id]; const c = colourOf(t);
  capMesh[id] = cap(dir, CAP, id === "commons" ? C.cream : mix(C.sand, c, t.sea ? 0.32 : 0.7));
  capMesh[id].userData.place = id;
}

// 路：平的帶子，下面一條較寬的深藍當描邊
function ribbon(pts, w, h, colour) {
  const pos = [], idx = [];
  pts.forEach((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const tan = b.clone().sub(a).normalize(); const side = new THREE.Vector3().crossVectors(p, tan).normalize();
    const c = p.clone().multiplyScalar(R + h);
    const l = c.clone().addScaledVector(side, w), r = c.clone().addScaledVector(side, -w);
    pos.push(l.x, l.y, l.z, r.x, r.y, r.z);
    if (i) { const k = i * 2; idx.push(k - 2, k - 1, k, k - 1, k + 1, k); }
  });
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, colour === C.navy ? flat(C.navy) : toon(colour)); m.material.side = THREE.DoubleSide; world.add(m); return m;
}
roads.forEach((r) => { ribbon(r.pts, 0.19, 0.022, C.navy); ribbon(r.pts, 0.13, 0.03, C.cream); });

// 湖：避開地方與路
const roadPts = roads.flatMap((r) => r.pts);
const nearRoad = (d, m) => roadPts.some((p) => p.angleTo(d) < m);
const nearPlace = (d, m) => Object.values(place).some((p) => p.angleTo(d) < CAP + m);
const lakes = [];
for (let tries = 0; lakes.length < 5 && tries < 400; tries++) {
  const d = new THREE.Vector3(rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1).normalize(); const a = 0.1 + rnd() * 0.08;
  if (nearPlace(d, a + 0.05) || nearRoad(d, a + 0.05) || lakes.some((l) => l.d.angleTo(d) < l.a + a + 0.1)) continue;
  lakes.push({ d, a }); cap(d, a, C.teal, 0.008);
}

// 樹：平塗的三角錐，一次畫完
const treeSpots = [];
for (let tries = 0; treeSpots.length < 120 && tries < 5000; tries++) {
  const d = new THREE.Vector3(rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1).normalize();
  if (nearPlace(d, 0.05) || nearRoad(d, 0.05) || lakes.some((l) => l.d.angleTo(d) < l.a + 0.04) || treeSpots.some((t) => t.d.angleTo(d) < 0.05)) continue;
  treeSpots.push({ d, s: 0.8 + rnd() * 0.45, dark: rnd() < 0.3, round: rnd() < 0.6 });
}
{
  // 兩種樹：圓的（棒棒糖）與尖的，都是平塗加深藍描邊
  const cone = new THREE.ConeGeometry(0.3, 0.7, 7); cone.translate(0, 0.55, 0);
  const ball = new THREE.SphereGeometry(0.3, 12, 8); ball.translate(0, 0.5, 0);
  const trunk = new THREE.CylinderGeometry(0.05, 0.05, 0.26, 6); trunk.translate(0, 0.13, 0);
  const groups = [
    [ball, C.teal, (t) => t.round && !t.dark], [ball, mix(C.teal, C.navy, 0.35), (t) => t.round && t.dark],
    [cone, C.teal, (t) => !t.round && !t.dark], [cone, mix(C.teal, C.navy, 0.35), (t) => !t.round && t.dark],
    [trunk, C.navy, null],
  ];
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (const [geo, colour, test] of groups) {
    const list = test ? treeSpots.filter(test) : treeSpots; if (!list.length) continue;
    const body = new THREE.InstancedMesh(geo, test ? toon(colour) : flat(colour), list.length);
    const ink = test ? new THREE.InstancedMesh(geo, INK, list.length) : null;
    list.forEach((t, i) => {
      q.setFromUnitVectors(YV, t.d); p.copy(t.d).multiplyScalar(R);
      s.setScalar(t.s); body.setMatrixAt(i, m4.compose(p, q, s));
      if (ink) { s.setScalar(t.s * 1.12); p.copy(t.d).multiplyScalar(R - 0.04); ink.setMatrixAt(i, m4.compose(p, q, s)); }
    });
    world.add(body); if (ink) world.add(ink);
  }
}

// ---------- 建築：一樣在做的事一棟，排在路之間 ----------
function placeOn(obj, dir, heading, lift = 0.012) {
  obj.position.copy(dir).multiplyScalar(R + lift);
  obj.quaternion.setFromUnitVectors(YV, dir);
  obj.rotateY(heading);
  world.add(obj);
}
function building(kind, colour) {
  const g = new THREE.Group(); const roof = colour === C.cream ? C.orange : colour === C.navy ? C.navy : colour;

    wN.copy(w.dir).applyQuaternion(world.quaternion).normalize();
    wT.set(0, -1, 0).addScaledVector(wN, wN.y).normalize();
    fPos.copy(wPos).addScaledVector(wN, 6).addScaledVector(wT, 7.5);
    fLook.copy(wPos).addScaledVector(wN, 0.6).addScaledVector(wT, -1.5);
    camera.position.lerpVectors(oPos, fPos, follow); lookAt.lerpVectors(oLook, fLook, follow);
    camera.up.copy(YV).lerp(wN, follow).normalize();
  } else { camera.position.copy(oPos); lookAt.copy(oLook); camera.up.copy(YV); lastW = null; }
  camera.lookAt(lookAt);
  if (!paused) {
    walkers.forEach((w) => stepWalker(w, dt));
    separate();
    orbiters.forEach((o) => o.pivot.rotateZ(o.speed * dt));
    flags.forEach((f, i) => f.rotation.y = Math.sin(t * 2 + i) * 0.25);
  }
  if (selected?.walker) {
    const w = selected.walker; marker.position.copy(w.dir).multiplyScalar(R + 0.05); marker.quaternion.setFromUnitVectors(YV, w.dir);
    if (!ptrs.size && !paused && !reduce && !qTarget) { const now = w.dir.clone().applyQuaternion(world.quaternion); const target = camDir.clone().applyAxisAngle(AX, -(W < 900 ? 0.12 : 0)); world.quaternion.premultiply(qa.setFromUnitVectors(now, now.clone().lerp(target, 1 - Math.exp(-dt * 3)).normalize())); }
  }
  renderer.render(scene, camera);
  camera.updateMatrixWorld();
  for (const [id, el] of Object.entries(labels)) {
    wp.copy(place[id]).multiplyScalar(R + 2.2); world.localToWorld(wp);
    const n = place[id].clone().applyQuaternion(world.quaternion);
    toCam.copy(camera.position).sub(wp).normalize();
    const vis = n.dot(toCam) > 0.2 && !(selected?.walker);
    wp.project(camera);
    const hw = (el.offsetWidth || 120) / 2 + 8, sx = Math.min(W - hw, Math.max(hw, (wp.x * 0.5 + 0.5) * W));
    el.style.transform = `translate(${sx}px, ${(-wp.y * 0.5 + 0.5) * H}px) translate(-50%,-100%)`;
    el.classList.toggle("off", !vis); el.tabIndex = vis ? 0 : -1;
  }
}
if (ok) requestAnimationFrame(frameLoop);
</script>
